<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>shan-shui-generator</title>
    <style>
:root {
  --ink: rgba(0, 0, 0, 0.4);
  --ink-faint: rgba(0, 0, 0, 0.1);
  --button-size: 32px;
}

body {
  margin: 0;
}

/* --- Floating buttons (settings, source link) ------------------------ */

.floating {
  position: fixed;
  top: 3px;
  z-index: 1000;
}

.icon-button {
  display: table;
  box-sizing: content-box;
  width: var(--button-size);
  height: var(--button-size);
  padding: 0;
  border: 1px solid var(--ink);
  background-color: transparent;
  color: var(--ink);
  font: inherit;
  text-align: center;
  cursor: pointer;
}

.icon-button:hover,
.side-button:hover {
  background-color: var(--ink-faint);
}

.icon-button > span {
  display: table-cell;
  vertical-align: middle;
  font-size: 18px;
}

#settings {
  left: 40px;
}

#source-link {
  left: 77px;
}

/* --- Settings menu ---------------------------------------------------- */

#menu {
  margin-top: 4px;
  padding-right: 4px;
  border: 1px solid var(--ink);
  background-color: var(--ink-faint);
}

#menu[hidden] {
  display: none;
}

#menu .label {
  margin: 0;
  font-family: monospace;
}

#menu table {
  border-spacing: 2px;
}

/* --- Scroll strip: [<]  landscape  [>] -------------------------------- */

.scroll-strip {
  border-bottom: 1px solid var(--ink-faint);
}

.side-button {
  display: table;
  box-sizing: content-box;
  width: 36px;
  padding: 0;
  border: 1px solid var(--ink);
  background-color: transparent;
  color: var(--ink);
  text-align: center;
  cursor: pointer;
  font: inherit;
}

.side-button > span {
  display: table-cell;
  vertical-align: middle;
  font-size: 32px;
}

#hidden-canvas {
  display: none;
}

#BG > svg {
  display: block;
}

/* --- Hanging-scroll style: one tall picture, no horizontal scrolling --- */

body.hanging .scroll-only {
  display: none;
}

body.hanging .scroll-strip {
  margin: 0 auto;
}

body.hanging #BG {
  width: 928px;
}

</style>
  </head>

  <body>
    <div id="settings" class="floating">
      <button
        type="button"
        id="settings-toggle"
        class="icon-button"
        title="Settings"
      >
        <span id="settings-icon">&#x2630;</span>
      </button>

      <div id="menu" hidden>
        <table>
          <tr>
            <td><div class="label">SEED</div></td>
          </tr>
          <tr>
            <td>
              <input title="random seed" id="seed-input" />
              <button type="button" id="seed-submit">Generate</button>
            </td>
          </tr>
          <tr>
            <td><div class="label">STYLE</div></td>
          </tr>
          <tr>
            <td>
              <select id="style-select" title="painting style">
                <option value="wang-wei-snowscapes-along-yangtze-river">
                  Wang Wei: Snowscapes along the Yangtze
                </option>
                <option value="scroll">Endless scroll</option>
              </select>
            </td>
          </tr>
          <tr class="scroll-only">
            <td><div class="label">VIEW</div></td>
          </tr>
          <tr class="scroll-only">
            <td>
              <button type="button" id="scroll-left" title="view left">
                &lt;
              </button>
              <input
                title="increment step"
                id="scroll-step"
                type="number"
                value="200"
                min="0"
                max="10000"
                step="20"
              />
              <button type="button" id="scroll-right" title="view right">
                &gt;
              </button>
            </td>
          </tr>
          <tr class="scroll-only">
            <td>
              <label class="label">
                <input id="auto-scroll" type="checkbox" />Auto-scroll
              </label>
            </td>
          </tr>
          <tr>
            <td><div class="label">SAVE</div></td>
          </tr>
          <tr>
            <td>
              <button
                type="button"
                id="download"
                title="WARNING: This may take a while..."
              >
                Download as .SVG
              </button>
            </td>
          </tr>
        </table>
      </div>
    </div>

    <a
      id="source-link"
      class="floating icon-button"
      href="https://github.com/josherich/shan-shui-generator"
      title="Fork me on Github!"
    >
      <span>&lt;/&gt;</span>
    </a>

    <table class="scroll-strip">
      <tr>
        <td class="scroll-only">
          <button
            type="button"
            id="side-left"
            class="side-button"
            title="Scroll left"
          >
            <span>&#x3008;</span>
          </button>
        </td>
        <td>
          <!-- The landscape SVG is rendered into this element. -->
          <div id="BG"></div>
        </td>
        <td class="scroll-only">
          <button
            type="button"
            id="side-right"
            class="side-button"
            title="Scroll right"
          >
            <span>&#x3009;</span>
          </button>
        </td>
      </tr>
    </table>
