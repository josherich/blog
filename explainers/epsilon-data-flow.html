<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Epsilon API — Data Flow</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:      #0b1120;
  --surf:    #131c2e;
  --surf2:   #1c2840;
  --surf3:   #243050;
  --border:  #2a3a58;
  --border2: #384d6e;
  --text:    #dde5f4;
  --muted:   #7b90b8;
  --accent:  #38bdf8;

  --client:   #64748b;
  --http:     #3b82f6;
  --app:      #8b5cf6;
  --executor: #f59e0b;
  --search:   #10b981;

  --radius: 7px;
  --mono: 'SF Mono', ui-monospace, 'Cascadia Code', 'Fira Code', monospace;
}

html, body { height: 100%; }
body {
  background: var(--bg);
  color: var(--text);
  font-family: -apple-system, BlinkMacSystemFont, 'Inter', 'Segoe UI', sans-serif;
  display: flex;
  flex-direction: column;
  overflow: hidden;
  font-size: 14px;
  line-height: 1.55;
}

/* ── Header ──────────────────────────────────────────── */
header {
  flex-shrink: 0;
  background: var(--surf);
  border-bottom: 1px solid var(--border);
}
.header-top {
  padding: 0.875rem 1.5rem 0;
  display: flex;
  align-items: baseline;
  gap: 0.75rem;
}
h1 { font-size: 0.9375rem; font-weight: 600; letter-spacing: -0.01em; }
.header-sub { font-size: 0.75rem; color: var(--muted); }

.tabs {
  display: flex;
  padding: 0.625rem 1.5rem 0;
  gap: 3px;
}
.tab {
  padding: 0.4375rem 0.875rem;
  border: 1px solid transparent;
  border-bottom: none;
  border-radius: 6px 6px 0 0;
  cursor: pointer;
  font-size: 0.75rem;
  font-family: var(--mono);
  color: var(--muted);
  background: transparent;
  transition: color 0.12s;
  user-select: none;
  white-space: nowrap;
}
.tab:hover { color: var(--text); }
.tab.active {
  background: var(--bg);
  border-color: var(--border);
  color: var(--text);
  margin-bottom: -1px;
  position: relative;
  z-index: 1;
}
.tab-method {
  font-size: 0.5625rem;
  font-weight: 800;
  color: #4ade80;
  letter-spacing: 0.06em;
  margin-right: 0.3rem;
}

/* ── Main layout ─────────────────────────────────────── */
.main {
  flex: 1;
  display: flex;
  overflow: hidden;
}

/* ── Flow panel (left) ───────────────────────────────── */
.flow-panel {
  width: 280px;
  flex-shrink: 0;
  border-right: 1px solid var(--border);
  overflow-y: auto;
  padding: 1rem 0.625rem 1.5rem 1rem;
}
.flow-ep-title {
  font-size: 0.6875rem;
  color: var(--muted);
  margin-bottom: 0.875rem;
  padding-left: 26px;
  font-family: var(--mono);
}
.flow-list { display: flex; flex-direction: column; }

.flow-item {
  display: flex;
  gap: 0.5rem;
  align-items: stretch;
  cursor: pointer;
}
.flow-spine {
  display: flex;
  flex-direction: column;
  align-items: center;
  flex-shrink: 0;
  width: 16px;
}
.flow-dot {
  width: 11px;
  height: 11px;
  border-radius: 50%;
  border: 2px solid currentColor;
  background: var(--bg);
  flex-shrink: 0;
  margin-top: 5px;
  transition: background 0.15s, box-shadow 0.15s;
}
.flow-item.active .flow-dot {
  background: currentColor;
  box-shadow: 0 0 0 3px color-mix(in srgb, currentColor 20%, transparent);
}
.flow-line {
  width: 2px;
  flex: 1;
  min-height: 6px;
  margin: 2px 0;
  background: var(--border);
}
.flow-pill-wrap {
  display: flex;
  align-items: center;
  gap: 4px;
  min-height: 18px;
  padding: 2px 0;
}
.flow-pill {
  font-size: 0.5rem;
  font-family: var(--mono);
  color: var(--muted);
  background: var(--surf2);
  border: 1px solid var(--border);
  border-radius: 3px;
  padding: 1px 5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  max-width: 130px;
}

.flow-card {
  flex: 1;
  padding: 0.375rem 0.625rem;
  border-radius: 6px;
  border: 1px solid transparent;
  margin-bottom: 2px;
  min-width: 0;
  transition: border-color 0.12s, background 0.12s;
}
.flow-item:hover .flow-card { border-color: var(--border2); background: var(--surf); }
.flow-item.active .flow-card { border-color: currentColor; background: var(--surf); }
.flow-item.shared .flow-card { opacity: 0.65; border-style: dashed; }

.flow-num {
  font-size: 0.5625rem;
  font-weight: 700;
  color: var(--muted);
  line-height: 1;
  margin-bottom: 0.125rem;
}
.flow-title {
  font-family: var(--mono);
  font-size: 0.72rem;
  color: var(--text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.flow-layer-label {
  font-size: 0.5rem;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  margin-top: 0.1rem;
}

/* ── Detail panel (right) ────────────────────────────── */
.detail-panel {
  flex: 1;
  overflow-y: auto;
  padding: 1.75rem 2rem;
  display: flex;
  flex-direction: column;
  gap: 1.25rem;
}
.detail-empty {
  margin: auto;
  text-align: center;
  color: var(--muted);
  font-size: 0.875rem;
}
.detail-empty .arrow { font-size: 1.5rem; margin-bottom: 0.5rem; color: var(--border2); }

.detail-header {
  display: flex;
  align-items: flex-start;
  gap: 0.75rem;
  padding-bottom: 1.125rem;
  border-bottom: 1px solid var(--border);
}
.layer-badge {
  padding: 0.25rem 0.5625rem;
  border-radius: 4px;
  font-size: 0.5625rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: #0b1120;
  flex-shrink: 0;
  margin-top: 3px;
}
.detail-title-wrap { flex: 1; min-width: 0; }
.detail-stepnum {
  font-size: 0.625rem;
  color: var(--muted);
  margin-bottom: 0.2rem;
  font-family: var(--mono);
}
.detail-title {
  font-family: var(--mono);
  font-size: 1.0625rem;
  font-weight: 600;
  color: var(--text);
  letter-spacing: -0.01em;
}
.detail-file {
  font-size: 0.6875rem;
  color: var(--muted);
  font-family: var(--mono);
  margin-top: 0.25rem;
}
.detail-file a { color: var(--accent); text-decoration: none; }
.detail-file a:hover { text-decoration: underline; }

.detail-desc {
  font-size: 0.9375rem;
  line-height: 1.75;
  color: var(--text);
}
.detail-desc p + p { margin-top: 0.625rem; }
.detail-desc code {
  font-family: var(--mono);
  font-size: 0.8125em;
  background: var(--surf3);
  padding: 1px 5px;
  border-radius: 3px;
  color: var(--accent);
}

.code-block {
  background: #060d1b;
  border: 1px solid var(--border);
  border-radius: var(--radius);
  overflow: hidden;
}
.code-head {
  background: var(--surf);
  border-bottom: 1px solid var(--border);
  padding: 0.375rem 0.875rem;
  font-size: 0.6875rem;
  color: var(--muted);
  font-family: var(--mono);
  display: flex;
  align-items: center;
  gap: 0.4rem;
}
.code-head::before {
  content: '';
  display: inline-block;
  width: 6px; height: 6px;
  border-radius: 50%;
  background: var(--border2);
}
.code-body {
  padding: 0.875rem 1rem;
  font-family: var(--mono);
  font-size: 0.7875rem;
  line-height: 1.7;
  color: #7da0c4;
  overflow-x: auto;
  white-space: pre;
}
/* syntax */
.hl-cm { color: #3d5270; }
.hl-st { color: #86efac; }
.hl-ty { color: #67e8f9; }
.hl-nu { color: #fda4af; }
.hl-kw { color: #93c5fd; }
.hl-at { color: #fde68a; }

.io-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 0.75rem;
}
.io-box {
  background: var(--surf);
  border: 1px solid var(--border);
  border-radius: 6px;
  padding: 0.75rem;
}
.io-label {
  font-size: 0.5625rem;
  font-weight: 800;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--muted);
  margin-bottom: 0.375rem;
}
.io-val {
  font-family: var(--mono);
  font-size: 0.8rem;
  color: var(--text);
  line-height: 1.55;
}

.shared-notice {
  background: var(--surf);
  border: 1px dashed var(--border2);
  border-radius: var(--radius);
  padding: 1rem 1.125rem;
  font-size: 0.875rem;
  line-height: 1.65;
  color: var(--muted);
}
.shared-notice strong { color: var(--text); }
.jump-btn {
  display: inline-block;
  margin-top: 0.75rem;
  padding: 0.375rem 0.875rem;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--surf2);
  color: var(--accent);
  cursor: pointer;
  font-size: 0.8125rem;
  font-family: inherit;
  transition: background 0.12s;
}
.jump-btn:hover { background: var(--surf3); }

/* ── Footer ───────────────────────────────────────────── */
footer {
  flex-shrink: 0;
  border-top: 1px solid var(--border);
  background: var(--surf);
  padding: 0.625rem 1.5rem;
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 1rem;
}
.legend { display: flex; gap: 1.125rem; flex-wrap: wrap; }
.legend-item {
  display: flex;
  align-items: center;
  gap: 0.375rem;
  font-size: 0.6875rem;
  color: var(--muted);
}
.legend-dot { width: 8px; height: 8px; border-radius: 50%; }

.footer-right { display: flex; align-items: center; gap: 0.875rem; flex-shrink: 0; }
.step-counter { font-size: 0.75rem; color: var(--muted); font-family: var(--mono); }
.nav-btns { display: flex; gap: 0.4375rem; }
.btn {
  padding: 0.375rem 0.875rem;
  border-radius: 5px;
  border: 1px solid var(--border2);
  background: var(--surf2);
  color: var(--text);
  cursor: pointer;
  font-size: 0.8125rem;
  font-family: inherit;
  transition: background 0.12s;
}
.btn:hover:not(:disabled) { background: var(--surf3); }
.btn:disabled { opacity: 0.3; cursor: default; }

/* scrollbar */
::-webkit-scrollbar { width: 6px; height: 6px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border2); border-radius: 3px; }
</style>
</head>
<body>

<header>
  <div class="header-top">
    <h1>Epsilon HTTP API</h1>
    <span class="header-sub">— data flow explorer</span>
  </div>
  <nav class="tabs" id="tabs"></nav>
</header>

<div class="main">
  <aside class="flow-panel" id="flow-panel"></aside>
  <main class="detail-panel" id="detail-panel"></main>
</div>

<footer>
  <div class="legend" id="legend"></div>
  <div class="footer-right">
    <span class="step-counter" id="counter"></span>
    <div class="nav-btns">
      <button class="btn" id="btn-prev" onclick="navigate(-1)">← Prev</button>
      <button class="btn" id="btn-next" onclick="navigate(+1)">Next →</button>
    </div>
  </div>
</footer>

<script>
// ── Layers ────────────────────────────────────────────────────────────────────

const LAYERS = {
  client:   { label: 'Client',   color: '#64748b' },
  http:     { label: 'HTTP',     color: '#3b82f6' },
  app:      { label: 'App',      color: '#8b5cf6' },
  executor: { label: 'Executor', color: '#f59e0b' },
  search:   { label: 'Search',   color: '#10b981' },
};

// ── Syntax highlighter ────────────────────────────────────────────────────────

const KW = new Set([
  'import','export','default','from','const','let','var','function','return',
  'async','await','pub','fn','struct','impl','use','mod','crate','self',
  'match','if','else','for','in','while','loop','move','mut','ref','type',
  'enum','where','dyn','trait','true','false','null','undefined','new',
  'this','typeof','class','extends','super','throw','try','catch','finally',
  'of','do','Some','None','Ok','Err','Arc','Vec','Box',
]);

function hl(raw) {
  const s = raw.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
  return s.replace(
    /(\/\/[^\n]*)|("(?:[^"\\]|\\.)*")|(`[^`]*`)|(#\[[^\]]*\])|(\b[A-Z][a-zA-Z0-9_]+\b)|(\b\d+\b)|(\b[a-z_][a-zA-Z0-9_]*\b)/g,
    (m, cm, dq, tq, attr, ty, nu, id) => {
      if (cm)   return `<span class="hl-cm">${m}</span>`;
      if (dq||tq) return `<span class="hl-st">${m}</span>`;
      if (attr) return `<span class="hl-at">${m}</span>`;
      if (ty)   return `<span class="hl-ty">${m}</span>`;
      if (nu)   return `<span class="hl-nu">${m}</span>`;
      if (id && KW.has(id)) return `<span class="hl-kw">${m}</span>`;
      return m;
    }
  );
}

// ── Step data ─────────────────────────────────────────────────────────────────

const ENDPOINTS = [

// ── POST /api/search ──────────────────────────────────────────────────────────
{
  id: 'search',
  method: 'POST',
  path: '/api/search',
  steps: [
    {
      layer: 'client',
      title: 'HTTP Request',
      output: 'JSON body',
      desc: `<p>Client sends a POST with a JSON body. <code>query</code> is the only required field — a free-text search term. The three optional fields enable per-call config overrides so the same server can be used with different connector sets.</p>`,
      code: `{
  "query":  "send email",          // required: BM25 search term
  "config": "type: api\\n...",     // optional: multi-doc YAML override
  "files":  { "/handler.js": "" }, // optional: virtual FS for config refs
  "env":    "dev"                  // "dev" (default) | "test"
}`,
      codeLabel: 'JSON',
    },
    {
      layer: 'http',
      title: 'search_handler',
      file: 'crates/http/src/lib.rs',
      line: 125,
      input: 'JSON body',
      output: 'SearchBody + env',
      desc: `<p>Axum extracts the body into <code>SearchBody</code> and generates a fresh <code>Uuid</code> for distributed tracing. The tracing span attaches <code>request_id</code> and <code>route</code> fields to every log line emitted during this request.</p><p>Immediately calls <code>validate_env()</code> — any value other than <code>"dev"</code> or <code>"test"</code> is rejected with 400 before any further work is done. A typo like <code>"development"</code> fails loudly rather than silently falling back to dev.</p>`,
      code: `struct SearchBody {
    query: String,
    #[serde(default)]
    config: Option<String>,
    #[serde(default)]
    files: Option<serde_json::Value>,
    #[serde(default)]
    env: Option<String>,
}

fn validate_env(raw: Option<&str>) -> anyhow::Result<&'static str> {
    match raw {
        None | Some("dev") => Ok("dev"),
        Some("test")       => Ok("test"),
        Some(other) => anyhow::bail!("unknown env '{other}'"),
    }
}`,
      codeLabel: 'Rust — http/src/lib.rs',
    },
    {
      layer: 'http',
      title: 'resolve_snapshot',
      file: 'crates/http/src/lib.rs',
      line: 194,
      input: 'config + files + env',
      output: 'Arc<AppSnapshot>',
      desc: `<p>Decides which <code>AppSnapshot</code> (search index + script pool + registries) to use. <strong>Fast path:</strong> if no <code>config</code>/<code>files</code> override and env is <code>"dev"</code>, returns the server's default snapshot immediately — a single pointer clone, no I/O.</p><p><strong>Slow path:</strong> computes a SHA-256 key from <code>yaml ++ 0x00 ++ files_json ++ 0x00 ++ env</code> and calls <code>snapshot_for_cache_key</code>. On a cache hit the existing <code>Arc&lt;AppSnapshot&gt;</code> is returned; on a miss, <code>build_override_snapshot</code> runs inside <code>spawn_blocking</code> to avoid starving the tokio runtime.</p>`,
      code: `async fn resolve_snapshot(
    app: &Arc<AppHandle>,
    override_yaml: Option<String>,
    override_files: Option<serde_json::Value>,
    env: &'static str,
) -> anyhow::Result<Arc<AppSnapshot>> {
    // Fast path: no overrides + dev env
    if override_yaml.is_none() && override_files.is_none() && env == "dev" {
        return Ok(app.snapshot().clone());
    }
    // Cache key: SHA-256(yaml ++ NUL ++ files_json ++ NUL ++ env)
    let key_hash = sha256(&yaml, &files_bytes, env);
    tokio::task::spawn_blocking(move || {
        app.snapshot_for_cache_key(&key, || build_override_snapshot(...))
    }).await
}`,
      codeLabel: 'Rust — http/src/lib.rs',
    },
    {
      layer: 'app',
      title: 'build_override_snapshot',
      file: 'crates/http/src/lib.rs',
      line: 262,
      input: 'YAML string + files + env',
      output: 'AppSnapshot',
      desc: `<p>Only reached on a cache miss. Picks a filesystem implementation: <code>JsonFs</code> when the caller supplied a <code>files</code> virtual tree (paths resolve inside the JSON object), or <code>NativeFs</code> which resolves against the server's <code>base_dir</code>.</p><p>Parses the YAML via <code>config::load_config_from_yaml_string</code>, which dispatches each <code>type:</code> block to the appropriate loader and applies env-specific overlays. Then calls <code>app::build_snapshot</code> to construct fresh registries (API, database, storage, LLM, email, function) and a new <code>ScriptPool</code>.</p>`,
      code: `fn build_override_snapshot(
    app: &AppHandle,
    yaml: String,
    files: Option<serde_json::Value>,
    env: &str,
) -> anyhow::Result<AppSnapshot> {
    let (base_dir, fs) = match files {
        Some(tree) => (PathBuf::from("/"), Box::new(JsonFs::new(tree)?)),
        None       => (app.base_dir().to_path_buf(), Box::new(NativeFs)),
    };
    let cfg = config::load_config_from_yaml_string(
        &yaml, &base_dir, "api-request.yaml", Some(env), &*fs,
    )?;
    app::build_snapshot(cfg, app.n_threads())
}`,
      codeLabel: 'Rust — http/src/lib.rs',
    },
    {
      layer: 'search',
      title: 'SearchIndex.search',
      file: 'crates/search/src/lib.rs',
      line: 48,
      input: 'query string',
      output: 'Vec<&SearchEntry>',
      desc: `<p>Runs a BM25 query against the <code>SearchIndex</code>. The index was built at startup (or snapshot-build time) from <code>SearchEntry</code> values — one per connector surface: each API endpoint, database table, LLM model, storage bucket, email template, and function library function.</p><p>Each entry contains the connector's name, JS import path, and a description of its call signature. BM25 ranks matches by term frequency and inverse document frequency, returning the most relevant entries first.</p>`,
      code: `// SearchEntry shape (one per callable connector surface)
{
  resource_kind: ApiEndpoint | DatabaseTable | LlmModel | ...,
  name: "stripe.createCharge",
  import_path: "api/stripe",
  signature: "createCharge(params: { amount: number, ... }): ChargeResult",
  description: "Create a new payment charge",
}`,
      codeLabel: 'SearchEntry structure',
    },
    {
      layer: 'search',
      title: 'format_results',
      file: 'crates/search/src/lib.rs',
      line: 67,
      input: 'Vec<&SearchEntry>',
      output: 'String',
      desc: `<p>Serializes the matched <code>SearchEntry</code> values into a plain-text response. Each entry becomes a block showing the JS import statement and the typed function signature. This text is what an LLM or developer reads to understand how to call a connector from a script.</p>`,
      code: `// Example format_results output:

import api from 'api/stripe';

api.createCharge(params: {
  amount: number,          // required
  currency: string,        // required
  customer?: string,
}): { id: string, status: string, ... }

---

import email from 'email/sendgrid';

email.send.welcome(
  envelope: { to: string },
  vars: { user_name: string },
)`,
      codeLabel: 'text/plain response',
    },
    {
      layer: 'client',
      title: '200 OK — text/plain',
      input: 'String',
      desc: `<p>Returns <code>200 OK</code> with <code>Content-Type: text/plain</code>. The body is the formatted connector signature listing. Unlike <code>/api/execute</code>, there is no JSON envelope — the response is plain text intended to be read directly by an LLM or copied into a script editor.</p>`,
      code: `HTTP/1.1 200 OK
Content-Type: text/plain; charset=utf-8

import api from 'api/stripe';
api.createCharge(params: { amount: number, ... }): { ... }

import db from 'db/analytics';
db.selectFrom('events')
  .where('user_id', '=', value)
  .execute(): EventRow[]`,
      codeLabel: 'HTTP Response',
    },
  ],
},

// ── POST /api/execute ─────────────────────────────────────────────────────────
{
  id: 'execute',
  method: 'POST',
  path: '/api/execute',
  steps: [
    {
      layer: 'client',
      title: 'HTTP Request',
      output: 'JSON body',
      desc: `<p>Client sends POST with a JSON body. <code>script</code> is the only required field — an ES module source with a default-exported handler function. <code>request</code> becomes <code>request.body</code> inside the script. Markdown code fences (<code>\`\`\`js ... \`\`\`</code>) are stripped automatically, so LLM-generated scripts work without preprocessing.</p>`,
      code: `{
  "script": "import api from 'api/stripe';\\nexport default ...",
  "request": { "amount": 100, "currency": "usd" },
  "config": null,  // optional: YAML override (same as /api/search)
  "files":  null,  // optional: virtual FS
  "env":    "dev"  // "dev" | "test"
}`,
      codeLabel: 'JSON',
    },
    {
      layer: 'http',
      title: 'execute_handler',
      file: 'crates/http/src/lib.rs',
      line: 155,
      input: 'JSON body',
      output: 'Arc<AppSnapshot> + script + request',
      desc: `<p>Mirrors <code>search_handler</code>: generates a tracing span with <code>request_id</code>, validates env, and resolves the snapshot via the same <code>resolve_snapshot</code> caching logic (fast path for default config, slow path for overrides).</p><p>Then calls <code>dispatch_script</code> with the resolved snapshot's <code>ScriptPool</code>, the script source, and the optional request body.</p>`,
      code: `struct ExecuteBody {
    script: String,
    request: Option<serde_json::Value>,
    #[serde(default)]

      code: `fn worker_loop(rx: Arc<Mutex<Receiver<ScriptJob>>>, providers: Arc<Providers>) {

// ── State ─────────────────────────────────────────────────────────────────────

let activeEp   = 0;
let activeStep = 0;

// ── Rendering ─────────────────────────────────────────────────────────────────

function layerColor(layer) { return LAYERS[layer]?.color ?? '#64748b'; }
function layerLabel(layer) { return LAYERS[layer]?.label ?? layer; }

function renderTabs() {
  const el = document.getElementById('tabs');
  el.innerHTML = ENDPOINTS.map((ep, i) => `
    <div class="tab ${i === activeEp ? 'active' : ''}" onclick="switchEp(${i})">
      <span class="tab-method">${ep.method}</span>${ep.path}
    </div>
  `).join('');
}

function renderLegend() {
  document.getElementById('legend').innerHTML = Object.entries(LAYERS).map(([k,v]) =>
    `<div class="legend-item">
      <span class="legend-dot" style="background:${v.color}"></span>${v.label}
    </div>`
  ).join('');
}

function renderFlow() {
  const ep = ENDPOINTS[activeEp];
  const steps = ep.steps;
  let html = `<div class="flow-ep-title">${ep.method} ${ep.path}</div><div class="flow-list">`;

  steps.forEach((step, i) => {
    const color = layerColor(step.layer);
    const isActive = i === activeStep;
    const isShared = step.shared;

    // Data pill between steps (output of previous step)
    if (i > 0) {
      const prev = steps[i - 1];
      const pill = prev.output ? `<span class="flow-pill">${prev.output}</span>` : '';
      html += `
        <div class="flow-item" style="pointer-events:none">
          <div class="flow-spine">
            <div class="flow-line"></div>
          </div>
          <div class="flow-pill-wrap">${pill}</div>
        </div>`;
    }

    html += `
      <div class="flow-item ${isActive ? 'active' : ''} ${isShared ? 'shared' : ''}"
           style="color:${color}" onclick="selectStep(${i})">
        <div class="flow-spine">
          <div class="flow-dot"></div>
        </div>
        <div class="flow-card">
          <div class="flow-num">STEP ${i + 1}</div>
          <div class="flow-title">${step.title}</div>
          <div class="flow-layer-label" style="color:${color}">${layerLabel(step.layer)}</div>
        </div>
      </div>`;
  });

  html += '</div>';
  document.getElementById('flow-panel').innerHTML = html;
}

function renderDetail() {
  const ep   = ENDPOINTS[activeEp];
  const step = ep.steps[activeStep];
  const color = layerColor(step.layer);
  const total = ep.steps.length;

  let html = `
    <div class="detail-header">
      <span class="layer-badge" style="background:${color}">${layerLabel(step.layer)}</span>
      <div class="detail-title-wrap">
        <div class="detail-stepnum">Step ${activeStep + 1} of ${total}</div>
        <div class="detail-title">${step.title}</div>
        ${step.file ? `<div class="detail-file">
          <a href="#" onclick="return false">${step.file}${step.line ? ':' + step.line : ''}</a>
        </div>` : ''}
      </div>
    </div>`;

  if (step.desc) {
    html += `<div class="detail-desc">${step.desc}</div>`;
  }

  if (step.shared) {
    html += `
      <div class="shared-notice">
        <strong>Shared execution path.</strong> The synthesized trampoline script flows
        through the exact same pipeline as <strong>POST /api/execute</strong> —
        <code>dispatch_script</code> → worker thread → QuickJS sandbox →
        connector registry → handler invocation → oneshot reply → JSON response.
        <br>
        <button class="jump-btn" onclick="jumpToExecute()">
          View full flow in /api/execute →
        </button>
      </div>`;
  }

  if (step.code) {
    html += `
      <div class="code-block">
        <div class="code-head">${step.codeLabel ?? 'Code'}</div>
        <div class="code-body">${hl(step.code)}</div>
      </div>`;
  }

  if (step.input || step.output) {
    html += `<div class="io-grid">`;
    if (step.input) {
      html += `<div class="io-box">
        <div class="io-label">↓ Input</div>
        <div class="io-val">${step.input}</div>
      </div>`;
    }
    if (step.output) {
      html += `<div class="io-box">
        <div class="io-label">↑ Output</div>
        <div class="io-val">${step.output}</div>
      </div>`;
    }
    html += `</div>`;
  }

  document.getElementById('detail-panel').innerHTML = html;
}

function renderNav() {
  const ep = ENDPOINTS[activeEp];
  document.getElementById('counter').textContent =
    `${activeStep + 1} / ${ep.steps.length}`;
  document.getElementById('btn-prev').disabled = activeStep === 0;
  document.getElementById('btn-next').disabled = activeStep === ep.steps.length - 1;
}

function render() {
  renderTabs();
  renderLegend();
  renderFlow();
  renderDetail();
  renderNav();
  // Scroll active step into view in the flow panel
  requestAnimationFrame(() => {
    const items = document.querySelectorAll('.flow-item.active');
    items[0]?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  });
}

// ── Interaction ───────────────────────────────────────────────────────────────

function switchEp(i) {
  activeEp   = i;
  activeStep = 0;
  render();
  document.getElementById('detail-panel').scrollTo(0, 0);
}

function selectStep(i) {
  activeStep = i;
  render();
  document.getElementById('detail-panel').scrollTo({ top: 0, behavior: 'smooth' });
}

function navigate(delta) {
  const ep = ENDPOINTS[activeEp];
  activeStep = Math.max(0, Math.min(ep.steps.length - 1, activeStep + delta));
  render();
  document.getElementById('detail-panel').scrollTo({ top: 0, behavior: 'smooth' });
}

function jumpToExecute() {
  // Switch to /api/execute, scroll to dispatch_script (step index 2)
  activeEp   = 1;
  activeStep = 2;
  render();
}

// Keyboard navigation
document.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown' || e.key === 'j') navigate(+1);
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp'   || e.key === 'k') navigate(-1);
  if (e.key === '1') switchEp(0);
  if (e.key === '2') switchEp(1);
  if (e.key === '3') switchEp(2);
});

// ── Init ──────────────────────────────────────────────────────────────────────

render();
</script>
