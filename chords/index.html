<title>Chord Reading Studio</title>
<meta name="description" content="Learn to sight-read piano chords on the grand staff: C major triads, common progressions, small pieces, then other keys.">

<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,400..700;1,6..96,400..700&family=IBM+Plex+Mono:wght@400;500&family=Instrument+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: curriculum rail on the left, one key per page in the lesson column, a piano dock pinned to the bottom edge */
:root{
  --paper:#F3F6F5; --surface:#FFFFFF; --ink:#15201E; --muted:#586965; --rule:#D3DDDA;
  --accent:#0D6A61; --accent-ink:#FFFFFF; --accent-soft:#D9EEEA;
  --play:#B86200; --play-soft:#FBE8CF;
  --maj:#0D6A61; --min:#3D4DA6; --dim:#A6461F;
  --ok:#1F7A3A; --bad:#B3261E;
  --dock:#E6ECEA; --key-white:#FBFBF8; --key-edge:#B9C2BF; --key-black:#1A1D1C;
  --font-display:'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --font-body:'Instrument Sans', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --font-mono:'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --dock-h:150px; --kw:30px; --bw:19px; --kh:104px;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#0E1413; --surface:#161F1E; --ink:#E3ECEA; --muted:#94A6A1; --rule:#2A3634;
    --accent:#4FC2B2; --accent-ink:#04201C; --accent-soft:#17403A;
    --play:#F2A73F; --play-soft:#45300F;
    --maj:#4FC2B2; --min:#9CA8F2; --dim:#F0946A;
    --ok:#5CCB7C; --bad:#F2867C;
    --dock:#111918; --key-white:#E6EAE8; --key-edge:#7E8986; --key-black:#070909;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#0E1413; --surface:#161F1E; --ink:#E3ECEA; --muted:#94A6A1; --rule:#2A3634;
  --accent:#4FC2B2; --accent-ink:#04201C; --accent-soft:#17403A;
  --play:#F2A73F; --play-soft:#45300F;
  --maj:#4FC2B2; --min:#9CA8F2; --dim:#F0946A;
  --ok:#5CCB7C; --bad:#F2867C;
  --dock:#111918; --key-white:#E6EAE8; --key-edge:#7E8986; --key-black:#070909;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.6 var(--font-body);-webkit-font-smoothing:antialiased}
button,select,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
a{color:var(--accent)}

.app{display:grid;grid-template-columns:250px minmax(0,1fr);max-width:1240px;margin:0 auto}
.rail{position:sticky;top:env(safe-area-inset-top,0px);align-self:start;max-height:calc(100vh - var(--dock-h));overflow:auto;padding:28px 22px 24px 24px;border-right:1px solid var(--rule);display:flex;flex-direction:column;gap:18px}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--font-display);font-size:19px;font-weight:600;line-height:1.15}
.brand svg{flex:none;color:var(--accent)}
.rail-sub{margin:0;color:var(--muted);font-size:13px}
.rail-h{margin:0 0 8px;font:500 11px/1 var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.keylist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:2px;counter-reset:k}
.keylist button{width:100%;display:grid;grid-template-columns:22px 1fr auto;align-items:baseline;gap:6px;padding:7px 8px;border:0;border-radius:6px;background:transparent;text-align:left}
.keylist button:hover{background:var(--accent-soft)}
.keylist button[aria-current="page"]{background:var(--ink);color:var(--paper)}
.keylist .kn{font:500 11px var(--font-mono);color:inherit;opacity:.6}
.keylist .kt{font-weight:500}
.keylist .ks{font:500 12px var(--font-mono);opacity:.75;white-space:nowrap}
.keylist .kbest{grid-column:2/4;font:400 11px var(--font-mono);opacity:.7}
.seg{display:inline-flex;flex-wrap:wrap;border:1px solid var(--rule);border-radius:7px;padding:2px;gap:2px;background:var(--surface)}
.rail .seg{display:flex;width:100%}
.rail .seg button{flex:1;padding:4px 2px;font-size:12.5px}
.seg button{border:0;background:transparent;padding:4px 10px;border-radius:5px;font-size:13px;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.rail-note{font-size:12.5px;color:var(--muted);margin:6px 0 0}

main{min-width:0;padding-block:36px calc(var(--dock-h) + 48px);padding-inline:44px}
.lesson{max-width:840px}
.key-head{display:flex;flex-direction:column;gap:14px;padding-bottom:26px;border-bottom:1px solid var(--rule)}
.eyebrow{margin:0;font:500 12px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
h1{margin:0;font-family:var(--font-display);font-weight:500;font-size:clamp(42px,7vw,72px);line-height:1;letter-spacing:-.01em;text-wrap:balance}
h1 em{font-style:italic;font-weight:400;color:var(--accent)}
.facts{display:flex;flex-wrap:wrap;gap:10px 34px;margin:4px 0 0}
.facts div{display:flex;flex-direction:column;gap:2px}
.facts dt{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.facts dd{margin:0;font-size:16px;font-weight:500}
.intro{margin:0;max-width:64ch;font-size:16.5px}
.toc{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:13.5px}
.toc a{text-decoration:none;color:var(--muted);border-bottom:1px solid var(--rule)}
.toc a:hover{color:var(--accent);border-color:var(--accent)}

.sec{padding-block:38px 8px;display:flex;flex-direction:column;gap:14px;scroll-margin-top:16px}
.sec h2{margin:0;display:flex;align-items:baseline;gap:12px;font-family:var(--font-display);font-weight:500;font-size:30px;line-height:1.15;text-wrap:balance}
.sec h2 .n{font:500 13px var(--font-mono);color:var(--accent);min-width:1.4em}
.sec p{margin:0;max-width:66ch}
.sec .lede{color:var(--ink)}
.muted{color:var(--muted)}
.tips{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px;max-width:66ch}

.score-card{background:var(--surface);border:1px solid var(--rule);border-radius:10px;padding:14px 16px 12px;display:flex;flex-direction:column;gap:10px}
.score{color:var(--ink);min-height:60px;overflow-x:auto}
.score svg{display:block}
.score .abcjs-note,.score .abcjs-rest{cursor:pointer}
.score .abcjs-note:hover path{fill:var(--accent)}
.score .hl path,.score .hl text{fill:var(--play)}
.score .abcjs-annotation{font-family:var(--font-body)}
.transport{display:flex;flex-wrap:wrap;align-items:center;gap:8px 14px;padding-top:10px;border-top:1px solid var(--rule)}
.btn-play{display:inline-flex;align-items:center;gap:8px;border:0;border-radius:7px;background:var(--accent);color:var(--accent-ink);padding:7px 14px 7px 12px;font-weight:600;font-size:14px}
.btn-play svg{width:12px;height:12px}
.btn-play[aria-pressed="true"]{background:var(--play);color:var(--surface)}
.tempo{display:inline-flex;align-items:center;gap:4px;font:500 13px var(--font-mono);font-variant-numeric:tabular-nums}
.tempo button{width:26px;height:26px;border:1px solid var(--rule);border-radius:6px;background:var(--surface);line-height:1}
.tempo output{min-width:2.4em;text-align:right}
.tempo .unit{color:var(--muted);font-size:12px}
.tog{display:inline-flex;align-items:center;gap:6px;font-size:13.5px;color:var(--muted);cursor:pointer}
.tog input{accent-color:var(--accent);margin:0}
.transport select{border:1px solid var(--rule);border-radius:6px;background:var(--surface);padding:4px 6px;font-size:13.5px}
.hint{margin-left:auto;font-size:12.5px;color:var(--muted)}

.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--rule);background:var(--surface);border-radius:999px;padding:5px 13px;font-size:14px}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip .rn{font-family:var(--font-display);font-style:italic;margin-left:6px;opacity:.85}
.about{display:flex;flex-direction:column;gap:6px}
.about h3{margin:0;font-size:18px;font-weight:600;display:flex;flex-wrap:wrap;gap:4px 12px;align-items:baseline}
.about h3 .rns{font-family:var(--font-display);font-style:italic;font-weight:400;color:var(--accent);font-size:19px}
.about .by{font-size:13px;color:var(--muted);font-weight:400}
.opts{display:flex;flex-wrap:wrap;gap:10px 22px;align-items:center}
.opt{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}

.family{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px}
.fam{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:10px 10px 9px;text-align:left}
.fam:hover{border-color:var(--accent)}
.fam .num{font-family:var(--font-display);font-style:italic;font-size:26px;line-height:1.05}
.fam .nm{font-weight:600}
.fam .tones{font:400 12px var(--font-mono);color:var(--muted)}
.fam .q{font:500 10.5px var(--font-mono);letter-spacing:.06em;text-transform:uppercase}
.q-maj{color:var(--maj)} .q-min{color:var(--min)} .q-dim{color:var(--dim)}

.shapes{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.shape{border-top:2px solid var(--ink);padding-top:10px;display:flex;flex-direction:column;gap:4px}
.shape h3{margin:0;font-size:15px;font-weight:600}
.shape .tn{font:500 13px var(--font-mono);color:var(--accent)}
.shape p{font-size:14px;color:var(--muted)}
.rule-box{border:1px solid var(--accent);background:var(--accent-soft);border-radius:8px;padding:12px 14px;max-width:66ch}
.rule-box strong{font-weight:600}

.drill{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:18px;align-items:start}
.drill-score{display:flex;justify-content:center;align-items:center;overflow:hidden;min-height:200px;border:1px solid var(--rule);border-radius:8px;background:var(--paper)}
.drill-side{display:flex;flex-direction:column;gap:12px;min-width:0}
.answers{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:6px}
.ans{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:0;font-weight:600;font-size:16px}
.ans small{font-family:var(--font-display);font-style:italic;font-weight:400;color:var(--muted);font-size:13px}
.ans:hover{border-color:var(--accent)}
.ans.right{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.ans.right small,.ans.wrong small{color:inherit}
.ans.wrong{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.feedback{min-height:48px;font-size:15px}
.feedback .ok{color:var(--ok);font-weight:600}
.feedback .bad{color:var(--bad);font-weight:600}
.entered{font:500 14px var(--font-mono);color:var(--muted)}
.stats{display:flex;flex-wrap:wrap;gap:6px 20px;font:500 13px var(--font-mono);font-variant-numeric:tabular-nums;color:var(--muted)}
.stats b{color:var(--ink);font-weight:500}
.row{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:7px;padding:6px 12px;font-size:14px}
.btn:hover{border-color:var(--accent)}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}

.next-key{margin-top:40px;padding-top:20px;border-top:1px solid var(--rule);display:flex;justify-content:space-between;gap:12px;flex-wrap:wrap}
.next-key button{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:2px}
.next-key .lbl{font:500 11px var(--font-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.next-key .big{font-family:var(--font-display);font-size:26px;font-style:italic;color:var(--accent)}
.next-key .nx{text-align:right;align-items:flex-end;margin-left:auto}

/* piano dock */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--dock);border-top:1px solid var(--rule);padding-bottom:env(safe-area-inset-bottom,0px)}
.dock-bar{display:flex;flex-wrap:wrap;align-items:center;gap:6px 16px;padding:7px 16px;max-width:1240px;margin:0 auto}
.dock-title{font:500 11px var(--font-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.dock-hint{font-size:12.5px;color:var(--muted)}
.dock-hint kbd{font:500 11px var(--font-mono);border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 4px;background:var(--surface);color:var(--ink)}
.dock-bar .sp{margin-left:auto}
.btn-ghost{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:3px 10px;font-size:12.5px}
.kb-scroll{overflow-x:auto;padding:0 16px 12px;scrollbar-width:thin}
.kb{position:relative;height:var(--kh);margin:0 auto;touch-action:none;user-select:none;-webkit-user-select:none}
.key{position:absolute;top:0}
.key.white{width:var(--kw);height:100%;background:var(--key-white);border:1px solid var(--key-edge);border-radius:0 0 5px 5px}
.key.black{width:var(--bw);height:62%;background:var(--key-black);z-index:2;border-radius:0 0 4px 4px;box-shadow:inset 0 -3px 0 rgba(255,255,255,.12)}
.key .lab{position:absolute;left:0;right:0;bottom:5px;text-align:center;font:500 10.5px/1 var(--font-mono);pointer-events:none}
.key.white .lab{color:#6B7673}
.key.black .lab{color:#DDE3E1;bottom:4px;font-size:9.5px}
.key .fg{position:absolute;left:0;right:0;text-align:center;font:600 12px/1 var(--font-mono);pointer-events:none}
.key.white .fg{bottom:22px}
.key.black .fg{bottom:16px}
.key.white.mid::after{content:"";position:absolute;left:50%;top:8px;width:5px;height:5px;margin-left:-2.5px;border-radius:50%;background:var(--key-edge)}
.key.on-play{background:var(--accent)}
.key.on-play .lab,.key.on-play .fg{color:var(--accent-ink)}
.key.on-user{background:var(--play)}
.key.on-user .lab,.key.on-user .fg{color:#FFFFFF}
.dock.collapsed .kb-scroll{display:none}

@media (max-width:900px){
  .app{grid-template-columns:minmax(0,1fr)}
  .rail{position:static;max-height:none;border-right:0;border-bottom:1px solid var(--rule);padding:18px 16px 16px;gap:12px}
  .rail-sub{display:none}
  .keylist{flex-direction:row;overflow-x:auto;gap:4px;padding-bottom:4px}
  .keylist li{flex:none}
  .keylist button{grid-template-columns:auto auto;padding:6px 10px;border:1px solid var(--rule)}
  .keylist .kn,.keylist .kbest{display:none}
  main{padding-inline:16px;padding-block:24px calc(var(--dock-h) + 32px)}
  .family{grid-auto-flow:column;grid-template-columns:none;grid-auto-columns:104px;overflow-x:auto;padding-bottom:4px}
  .shapes{grid-template-columns:minmax(0,1fr)}
  .drill{grid-template-columns:minmax(0,1fr)}
  :root{--kw:26px;--bw:16px;--kh:86px}
  .hint{margin-left:0;width:100%}
  .dock-hint{display:none}
}
@media (prefers-reduced-motion:reduce){*{scroll-behavior:auto!important}}
</style>

<div class="app">
  <aside class="rail" aria-label="Lessons">
    <div class="brand">
      <svg width="34" height="30" viewBox="0 0 34 30" aria-hidden="true"><g stroke="currentColor" stroke-width="1" opacity=".55"><line x1="0" y1="5" x2="34" y2="5"/><line x1="0" y1="10" x2="34" y2="10"/><line x1="0" y1="15" x2="34" y2="15"/><line x1="0" y1="20" x2="34" y2="20"/><line x1="0" y1="25" x2="34" y2="25"/></g><g fill="currentColor"><ellipse cx="17" cy="25" rx="4.2" ry="2.9" transform="rotate(-20 17 25)"/><ellipse cx="17" cy="15" rx="4.2" ry="2.9" transform="rotate(-20 17 15)"/><ellipse cx="17" cy="5" rx="4.2" ry="2.9" transform="rotate(-20 17 5)"/></g></svg>

</div>

<div class="dock" id="dock">
  <div class="dock-bar">

</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/abcjs/6.4.4/abcjs-basic-min.js"></script>
<script>
'use strict';
const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => Array.from(r.querySelectorAll(s));
const store = {
  get(k, d) { try { const v = localStorage.getItem('crs.' + k); return v == null ? d : JSON.parse(v); } catch (e) { return d; } },
  set(k, v) { try { localStorage.setItem('crs.' + k, JSON.stringify(v)); } catch (e) {} }
};
const prefs = Object.assign({ labels: 'both', keyNames: true }, store.get('prefs', {}));
const labelFlags = () => ({ names: prefs.labels === 'both' || prefs.labels === 'names', numerals: prefs.labels === 'both' || prefs.labels === 'numerals' });

/* ---------------- theory ---------------- */
const LET = 'CDEFGAB', STEP = [0, 2, 4, 5, 7, 9, 11];
const ACC = { '-2': '𝄫', '-1': '♭', '0': '', '1': '♯', '2': '𝄪' };
const mod = (a, n) => ((a % n) + n) % n;
const pcOf = n => mod(STEP[n.L] + n.acc, 12);
const midiOf = n => 12 * (n.oct + 1) + STEP[n.L] + n.acc;
const nameOf = n => LET[n.L] + ACC[n.acc];
const withOct = (n, o) => ({ L: n.L, acc: n.acc, oct: o });
const mean = a => a.reduce((s, x) => s + x, 0) / a.length;
const SHARP_ORDER = [3, 0, 4, 1, 5, 2, 6], FLAT_ORDER = [6, 2, 5, 1, 4, 0, 3];
const RN = { i: 1, ii: 2, iii: 3, iv: 4, v: 5, vi: 6, vii: 7 };
const DIATONIC = { major: ['I', 'ii', 'iii', 'IV', 'V', 'vi', 'vii°'], minor: ['i', 'ii°', 'III', 'iv', 'V', 'VI', 'VII'] };
const PRIMARY = { major: ['I', 'IV', 'V'], minor: ['i', 'iv', 'V'] };
const QNAME = { maj: 'major', min: 'minor', dim: 'diminished' };

const KEYS = [
  { id: 'c-major', t: 'C', m: 'major' },
  { id: 'g-major', t: 'G', m: 'major' },
  { id: 'f-major', t: 'F', m: 'major' },
  { id: 'a-minor', t: 'A', m: 'minor' },
  { id: 'd-major', t: 'D', m: 'major' },
  { id: 'bb-major', t: 'Bb', m: 'major' },
  { id: 'e-minor', t: 'E', m: 'minor' },
  { id: 'd-minor', t: 'D', m: 'minor' },
  { id: 'a-major', t: 'A', m: 'major' },
  { id: 'eb-major', t: 'Eb', m: 'major' }
];
const SCALE_FINGERS = {
  Bb: { rh: '41231234', lh: '32143213' },
  Eb: { rh: '31234123', lh: '32143213' },
  F: { rh: '12341234', lh: '54321321' },
  _: { rh: '12312345', lh: '54321321' }
};

function makeKey(def) {
  const t = { L: LET.indexOf(def.t[0]), acc: def.t[1] === '#' ? 1 : def.t[1] === 'b' ? -1 : 0 };
  const minor = def.m === 'minor';

const state = { key: null, prog: 0, pattern: 'whole', voicing: 'smooth', piece: 0 };
function segHTML(opt, items, cur) {
  return `<div class="seg" data-opt="${opt}" role="group">${items.map(([v, l]) => `<button type="button" data-v="${v}" aria-pressed="${v === cur}">${l}</button>`).join('')}</div>`;
}
function renderKeylist() {
  const best = store.get('best', {});
  $('#keylist').innerHTML = KEYS.map((d, i) => {
    const k = makeKey(d);
    return `<li><button type="button" data-key="${d.id}" ${state.key && state.key.id === d.id ? 'aria-current="page"' : ''}><span class="kn">${String(i + 1).padStart(2, '0')}</span><span class="kt">${k.name}</span><span class="ks">${k.sigShort}</span>${best[d.id] ? `<span class="kbest">best drill streak ${best[d.id]}</span>` : ''}</button></li>`;
  }).join('');
  $$('#keylist button').forEach(b => b.addEventListener('click', () => go(b.dataset.key)));
}
function go(id) {
  renderPage(id);
  try { history.replaceState(null, '', '#' + id); } catch (e) {}
  store.set('lastKey', id);
  window.scrollTo({ top: 0 });
}

function renderPage(id) {
  Player.stop();
  const def = KEYS.find(k => k.id === id) || KEYS[0], idx = KEYS.indexOf(def), key = makeKey(def);
  state.key = key; state.prog = 0; state.piece = 0; cards = []; drill = null;
  renderKeylist();
  const first = idx === 0, tonic = chordOf(key, key.minor ? 'i' : 'I');
  const tn = tonic.tones.map(nameOf);
  const prim = PRIMARY[key.mode].map(r => chordOf(key, r).name).join(', ');
  const lt = nameOf(key.leading);
  const intro = first
    ? 'Start here. C major uses only the white keys, so you can learn to recognise chord shapes on the staff without tracking sharps or flats. Work through the sections in order, then move to the next key in the path.'
    : key.minor
      ? `${key.name} is the relative minor of ${key.relative}: same key signature, different home note. Its V chord needs a raised 7th, ${lt}, which is always written as an accidental.`
      : `Same plan as C major, now with ${key.sigText}. The key signature changes what you play, not what you see: every triad still stacks line-line-line or space-space-space.`;
  const secs = [];
  if (first) secs.push({ id: 'staff', title: 'Reading the grand staff', html: `
    <p>Piano music uses two staves joined by a brace. The treble clef on top is usually the right hand; the bass clef below is usually the left. Middle C sits on a short ledger line between them.</p>
    <ul class="tips">
      <li>Memorise a few landmark notes, then read everything else as a distance from them.</li>
      <li>Notes a <b>3rd</b> apart skip one letter and go line to line or space to space. A triad is two 3rds stacked.</li>
      <li>Low C, Bass C, Bass F, Middle C, Treble G and Treble C cover most of what you will read below.</li>
    </ul>
    ${cardHTML('staff')}` });
  secs.push({ id: 'scale', title: 'The scale', html: `
    <p>${key.minor
      ? `This is the <b>harmonic minor</b> scale: natural minor with the 7th raised to ${lt}. That raised note is the 3rd of the V chord and gives minor keys their pull home.`
      : first ? 'Eight notes from C to C, all white keys. Every chord in this unit is built only from these notes.' : `Every chord in this unit is built from these notes. The key signature (${key.sigText}) applies to every line, so it is written once at the start instead of on each note.`}
      Play hands together, one octave apart. Finger numbers are printed above each note: 1 is the thumb, 5 the little finger.</p>
    ${cardHTML('scale')}` });
  secs.push({ id: 'tonic', title: `The ${key.tonicName} ${key.minor ? 'minor' : 'major'} chord`, html: `
    <p>The tonic chord is ${tn.join('–')}: the 1st, 3rd and 5th notes of the scale. The same three notes can be stacked three ways. Each shape looks different on the staff, so learn to read them as shapes rather than note by note.</p>
    ${cardHTML('tonic')}
    <div class="shapes">
      <div class="shape"><h3>Root position</h3><span class="tn">${tn[0]} · ${tn[1]} · ${tn[2]}</span><p>Three notes on three lines or three spaces, like a snowman. The bottom note names the chord.</p></div>
      <div class="shape"><h3>1st inversion</h3><span class="tn">${tn[1]} · ${tn[2]} · ${tn[0]}</span><p>The root moves to the top. Two notes sit a 3rd apart, then a wider gap (a 4th) above them.</p></div>
      <div class="shape"><h3>2nd inversion</h3><span class="tn">${tn[2]} · ${tn[0]} · ${tn[1]}</span><p>The gap moves to the bottom. The root is now the middle note.</p></div>
    </div>
    <p class="rule-box"><strong>One rule for every inversion:</strong> find the 4th (the gap). Its upper note is the root. No gap means root position, and the bottom note is the root.</p>` });
  secs.push({ id: 'family', title: `Chords in ${key.name}`, html: `
    <p>${key.minor
      ? 'Build a triad on each scale note. In natural minor, v would be minor; raising the 7th turns it into a major <b>V</b>. III, VI and VII are major, i and iv are minor, ii° is diminished.'
      : 'Build a triad on each scale note using only notes of the key. You get three major chords (I, IV, V), three minor (ii, iii, vi) and one diminished (vii°). Uppercase numerals are major; lowercase are minor.'}
      Tap a chord to hear it and see it on the keyboard.</p>
    <div class="family" id="fam-grid">${DIATONIC[key.mode].map(rn => { const c = chordOf(key, rn); return `<button type="button" class="fam" data-rn="${rn}"><span class="num q-${c.q}">${rn}</span><span class="nm">${c.name}</span><span class="tones">${c.tones.map(nameOf).join(' ')}</span><span class="q q-${c.q}">${QNAME[c.q]}</span></button>`; }).join('')}</div>
    ${cardHTML('family')}` });
  secs.push({ id: 'progressions', title: 'Common progressions', html: `
    <p>Progressions are the chord sequences songs are built on. Read the chord names first, then switch labels to <i>None</i> in the side panel and read the shapes alone. <i>Smooth</i> voicing moves each chord to its nearest inversion, the way pianists actually play them.</p>
    <div class="chips" id="prog-chips">${PROGS[key.mode].map((p, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === 0}">${p.name}</button>`).join('')}</div>
    <div class="about" id="prog-about"></div>
    <div class="opts">
      <div class="opt">Texture ${segHTML('pattern', PATTERNS.map(p => [p.id, p.name]), state.pattern)}</div>
      <div class="opt">Voicing ${segHTML('voicing', [['smooth', 'Smooth'], ['root', 'Root position']], state.voicing)}</div>
    </div>
    ${cardHTML('prog')}` });
  secs.push({ id: 'pieces', title: 'Practice pieces', html: `
    <p>Short pieces that use only the chords above. Before playing, scan the left hand and name each chord, then read the melody against it. Start slow; raise the tempo once a run is clean.</p>
    <div class="chips" id="piece-chips">${PIECES[key.mode].map((p, i) => `<button type="button" class="chip" data-i="${i}" aria-pressed="${i === 0}">${p.title}</button>`).join('')}</div>
    <div class="about" id="piece-about"></div>
    ${cardHTML('piece')}` });
  secs.push({ id: 'drill', title: 'Sight-reading drill', html: `
    <p>A chord appears with no label. Name it, or play it on the keyboard. Correct answers move on by themselves; your best streak for each key is saved in this browser.</p>
    <div class="score-card" id="drill-card">
      <div class="opts">
        <div class="opt">Chords ${segHTML('set', [['primary', PRIMARY[key.mode].join(' ')], ['all', 'All seven']], '')}</div>
        <div class="opt">Inversions ${segHTML('inv', [['off', 'Off'], ['on', 'On']], '')}</div>
        <div class="opt">Staff ${segHTML('staff', [['treble', 'Treble'], ['bass', 'Bass'], ['mixed', 'Mixed']], '')}</div>
        <div class="opt">Answer by ${segHTML('mode', [['name', 'Naming'], ['play', 'Playing']], '')}</div>
      </div>
      <div class="drill">
        <div class="drill-score score" id="drill-score" aria-label="Chord to identify. Click to hear it."></div>
        <div class="drill-side">
          <div class="answers" id="drill-answers"></div>
          <div class="entered" id="drill-entered" hidden></div>
          <div class="feedback" id="drill-feedback" aria-live="polite"></div>
          <div class="row">
            <button type="button" class="btn" id="drill-hear">Hear it</button>
            <button type="button" class="btn" id="drill-clear" hidden>Clear notes</button>
            <button type="button" class="btn btn-primary" id="drill-next">Next chord</button>
          </div>
          <div class="stats" id="drill-stats"></div>
        </div>
      </div>
    </div>` });

  const prev = KEYS[idx - 1], next = KEYS[idx + 1];
  $('#lesson').innerHTML = `
    <header class="key-head">
      <p class="eyebrow">Unit ${idx + 1} of ${KEYS.length} · ${key.minor ? 'Minor' : 'Major'} key</p>
      <h1>${key.tonicName} <em>${key.mode}</em></h1>
      <dl class="facts">
        <div><dt>Key signature</dt><dd>${key.sigText}</dd></div>
        <div><dt>${key.minor ? 'Relative major' : 'Relative minor'}</dt><dd>${key.relative}</dd></div>
        <div><dt>Primary chords</dt><dd>${prim}</dd></div>
      </dl>
      <p class="intro">${intro}</p>
      <nav class="toc" aria-label="Sections">${secs.map((s, i) => `<a href="#${s.id}">${i + 1}. ${s.title}</a>`).join('')}</nav>
    </header>
    ${secs.map((s, i) => `<section class="sec" id="${s.id}"><h2><span class="n">${String(i + 1).padStart(2, '0')}</span>${s.title}</h2>${s.html}</section>`).join('')}
    <nav class="next-key" aria-label="Other keys">
      ${prev ? `<button type="button" data-key="${prev.id}"><span class="lbl">Previous</span><span class="big">${makeKey(prev).name}</span></button>` : ''}
      ${next ? `<button type="button" class="nx" data-key="${next.id}"><span class="lbl">Next key</span><span class="big">${makeKey(next).name}</span></button>` : ''}
    </nav>`;
  $$('.next-key button').forEach(b => b.addEventListener('click', () => go(b.dataset.key)));
  $$('.toc a').forEach(a => a.addEventListener('click', e => { e.preventDefault(); const t = document.getElementById(a.getAttribute('href').slice(1)); if (t) t.scrollIntoView({ behavior: 'smooth' }); }));

  if (first) new ScoreCard('staff', () => buildLandmarks(key), { tempo: 60, perLine: 6, maxSpacing: 5 });
  new ScoreCard('scale', () => buildScale(key), { tempo: 88 });
  new ScoreCard('tonic', () => buildTonic(key), { tempo: 50, perLine: 3, maxSpacing: 8 });
  new ScoreCard('family', () => buildFamily(key), { tempo: 72 });

  $$('#fam-grid .fam').forEach(b => b.addEventListener('click', () => {
    const v = famVoicing(key, b.dataset.rn), notes = v.rh.concat(v.lh);
    playNotesNow(notes, 1.3);
    notes.forEach(n => light(midiOf(n), 'play', prefs.keyNames ? nameOf(n) : ''));
    setTimeout(() => notes.forEach(n => unlight(midiOf(n), 'play')), 1300);
  }));

  // progressions
  const progCard = new ScoreCard('prog', () => {
    const p = PROGS[key.mode][state.prog], pat = PATTERNS.find(x => x.id === state.pattern);
    return buildScore(key, [4, 4], realize(key, p.bars.map(rn => [{ rn }]), [4, 4], { rh: pat.rh, lh: pat.lh, voicing: state.voicing }), { stretch: true });
  }, { tempo: 80 });
  const progAbout = () => {
    const p = PROGS[key.mode][state.prog];
    $('#prog-about').innerHTML = `<h3>${p.name} <span class="rns">${p.bars.join(' – ')}</span></h3><p>${p.about} In ${key.name}: ${p.bars.map(r => chordOf(key, r).name).join(' – ')}.</p>`;
  };
  progAbout();
  $$('#prog-chips .chip').forEach(b => b.addEventListener('click', () => {
    state.prog = +b.dataset.i; $$('#prog-chips .chip').forEach(x => x.setAttribute('aria-pressed', x === b)); progAbout(); progCard.render();
  }));
  $$('#progressions .seg[data-opt]').forEach(seg => $$('button', seg).forEach(b => b.addEventListener('click', () => {
    state[seg.dataset.opt] = b.dataset.v; $$('button', seg).forEach(x => x.setAttribute('aria-pressed', x === b)); progCard.render();
  })));

  // pieces
  const pieceCard = new ScoreCard('piece', () => {
    const p = PIECES[key.mode][state.piece];
    return buildScore(key, p.meter, realize(key, parseBars(p.harmony), p.meter, { melody: p.melody, rh: p.rh, lh: p.lh, voicing: p.voicing || 'smooth', endWhole: p.endWhole }));
  }, { tempo: PIECES[key.mode][0].tempo });
  const pieceAbout = () => {
    const p = PIECES[key.mode][state.piece];
    $('#piece-about').innerHTML = `<h3>${p.title} <span class="by">${p.by} · ${p.meter.join('/')} · arranged in ${key.name}</span></h3><p>${p.about}</p>`;
  };
  pieceAbout();
  $$('#piece-chips .chip').forEach(b => b.addEventListener('click', () => {
    state.piece = +b.dataset.i; $$('#piece-chips .chip').forEach(x => x.setAttribute('aria-pressed', x === b));
    const p = PIECES[key.mode][state.piece]; pieceCard.tempo = p.tempo; pieceCard.bpm.textContent = p.tempo;
    pieceAbout(); pieceCard.render();
  }));

  drill = new Drill(key);
}

/* ---------------- global wiring ---------------- */
function syncLabelsSeg() { $$('#labels-seg button').forEach(b => b.setAttribute('aria-pressed', b.dataset.v === prefs.labels)); }
$$('#labels-seg button').forEach(b => b.addEventListener('click', () => {
  prefs.labels = b.dataset.v; store.set('prefs', prefs); syncLabelsSeg();
  cards.filter(c => c.id === 'prog' || c.id === 'piece').forEach(c => c.render());
}));
syncLabelsSeg();
$('#kb-names').checked = prefs.keyNames;
$('#kb-names').addEventListener('change', e => { prefs.keyNames = e.target.checked; store.set('prefs', prefs); });
$('#kb-toggle').addEventListener('click', e => {
  const d = $('#dock'), c = d.classList.toggle('collapsed');
  e.target.textContent = c ? 'Show keys' : 'Hide keys'; e.target.setAttribute('aria-expanded', !c);
});
$('#kb-midi').addEventListener('click', async e => {
  const btn = e.target;
  try {
    if (!navigator.requestMIDIAccess) throw new Error('none');
    const acc = await navigator.requestMIDIAccess();
    const hook = () => acc.inputs.forEach(inp => (inp.onmidimessage = msg => {
      const [s, n, v] = msg.data, cmd = s & 0xf0;
      if (cmd === 0x90 && v > 0) userOn(n); else if (cmd === 0x80 || (cmd === 0x90 && v === 0)) userOff(n);
    }));
    hook(); acc.onstatechange = hook;
    btn.textContent = acc.inputs.size ? `MIDI: ${acc.inputs.size} input${acc.inputs.size > 1 ? 's' : ''}` : 'MIDI: no device';
  } catch (err) {
    btn.textContent = 'MIDI unavailable here';
    btn.title = 'This view blocks MIDI. Open the HTML file directly in Chrome or Edge to use a MIDI keyboard.';
  }
});
const dockRO = new ResizeObserver(() => document.documentElement.style.setProperty('--dock-h', $('#dock').offsetHeight + 'px'));
dockRO.observe($('#dock'));
let lastW = 0, rt = null;
new ResizeObserver(() => {
  const w = $('#lesson').clientWidth; if (Math.abs(w - lastW) < 24) return; lastW = w;
  clearTimeout(rt); rt = setTimeout(() => { cards.forEach(c => c.render()); if (drill) drill.render(); }, 150);
}).observe($('#lesson'));

buildKeyboard();
const startId = (location.hash || '').slice(1);
renderPage(KEYS.some(k => k.id === startId) ? startId : (store.get('lastKey', 'c-major')));
lastW = $('#lesson').clientWidth;
</script>
