<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>古意 · 皮影</title>
<style>
  html,body{margin:0;height:100%;background:#0a0503;overflow:hidden}
  canvas{display:block;position:fixed;inset:0;cursor:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<script>
'use strict';
/* ────────────────────────────────────────────────────────────────────────────
   古意 · 李颀 — a shadow-puppet (皮影) animation, drawn entirely in code.
   Puppets are cut "leather": translucent coloured pieces with carved holes,
   riveted joints, and control rods, composited (multiply) onto a lamp-lit
   paper screen. Space: pause · ←/→: previous / next scene.
   ──────────────────────────────────────────────────────────────────────────── */

const TAU = Math.PI * 2, PI = Math.PI;
const lerp = (a, b, t) => a + (b - a) * t;
const clamp = (x, a = 0, b = 1) => x < a ? a : x > b ? b : x;
const ss = t => { t = clamp(t); return t * t * (3 - 2 * t); };
const fr = x => x - Math.floor(x);
const h1 = i => fr(Math.sin(i * 127.1 + 311.7) * 43758.5453);
function vn(x) { const i = Math.floor(x), f = x - i, u = f * f * (3 - 2 * f); return lerp(h1(i), h1(i + 1), u); }
const sn = x => vn(x) * 2 - 1;

const W = 1600, H = 900, FR = 34;
const FONT = '"Kaiti SC","STKaiti","KaiTi","BiauKai","Kaiti TC","Songti SC","STSong","Noto Serif SC",serif';

/* ── palette: dyed, translucent leather ─────────────────────────────────── */
const INK = 'rgba(22,11,5,0.97)';
const C = {
  red: 'rgba(160,36,20,0.84)', red2: 'rgba(118,22,12,0.9)', green: 'rgba(34,94,64,0.82)',
  teal: 'rgba(30,82,92,0.8)', ochre: 'rgba(200,132,38,0.74)', yellow: 'rgba(214,170,58,0.62)',
  black: 'rgba(28,16,9,0.93)', dark: 'rgba(18,9,4,0.96)', brown: 'rgba(96,52,24,0.86)',
  pale: 'rgba(236,212,160,0.22)', blue: 'rgba(42,66,112,0.78)', face: 'rgba(240,214,170,0.08)',
  redface: 'rgba(178,42,24,0.74)', skin: 'rgba(236,200,150,0.18)', hill: 'rgba(64,36,20,0.62)'
};

/* ── canvas setup ───────────────────────────────────────────────────────── */
const cv = document.getElementById('c'), X = cv.getContext('2d');
const fig = document.createElement('canvas'), F = fig.getContext('2d');
const tmp = document.createElement('canvas'), TM = tmp.getContext('2d');
let S = 1, OX = 0, OY = 0, DPR = 1, PW = 1, PH = 1;
const FILTER_OK = (() => { const t = document.createElement('canvas').getContext('2d');
  if (!('filter' in t)) return false; t.filter = 'blur(2px)'; return t.filter === 'blur(2px)'; })();

function resize() {
  DPR = Math.min(window.devicePixelRatio || 1, 2);
  const w = innerWidth, h = innerHeight;
  if (w * h * DPR * DPR > 4.2e6) DPR = Math.sqrt(4.2e6 / (w * h));
  S = Math.min(w / (W + FR * 2), h / (H + FR * 2));
  PW = Math.round(w * DPR); PH = Math.round(h * DPR);
  cv.width = fig.width = PW; cv.height = fig.height = PH;
  cv.style.width = w + 'px'; cv.style.height = h + 'px';
  OX = (w - W * S) / 2; OY = (h - H * S) / 2;
  if (ZOOM) { S *= ZOOM[2]; OX = w / 2 - ZOOM[0] * S; OY = h / 2 - ZOOM[1] * S; }
}
let ZOOM = null;
addEventListener('resize', resize);
const stageT = c => c.setTransform(DPR * S, 0, 0, DPR * S, DPR * OX, DPR * OY);

/* ── paper texture (generated once) ─────────────────────────────────────── */
const paper = document.createElement('canvas');
(function makePaper() {
  const w = 800, h = 450; paper.width = w; paper.height = h;
  const g = paper.getContext('2d'), id = g.createImageData(w, h), d = id.data;
  for (let i = 0; i < w * h; i++) {
    const x = i % w, y = (i / w) | 0;
    const v = 238 + 10 * Math.random() + 6 * sn(x * 0.02 + y * 0.013) + 5 * sn(y * 0.05 + 40);
    d[i * 4] = v; d[i * 4 + 1] = v - 3; d[i * 4 + 2] = v - 9; d[i * 4 + 3] = 255;
  }
  g.putImageData(id, 0, 0);
  g.lineCap = 'round';
  for (let i = 0; i < 1300; i++) {
    const x = Math.random() * w, y = Math.random() * h, a = Math.random() * TAU, l = 4 + Math.random() * 18;
    g.strokeStyle = `rgba(110,80,50,${0.05 + Math.random() * 0.08})`; g.lineWidth = 0.4 + Math.random() * 0.5;
    g.beginPath(); g.moveTo(x, y);
    g.quadraticCurveTo(x + Math.cos(a + 0.6) * l * 0.6, y + Math.sin(a + 0.6) * l * 0.6, x + Math.cos(a) * l, y + Math.sin(a) * l); g.stroke();
  }
  for (let i = 0; i < 26; i++) {
    const x = Math.random() * w, y = Math.random() * h, r = 30 + Math.random() * 120;
    const gr = g.createRadialGradient(x, y, 0, x, y, r);
    gr.addColorStop(0, 'rgba(140,100,60,0.06)'); gr.addColorStop(1, 'rgba(140,100,60,0)');
    g.fillStyle = gr; g.fillRect(x - r, y - r, r * 2, r * 2);
  }
})();

/* ── layer compositing ──────────────────────────────────────────────────── */
function clipScreen(c) { c.beginPath(); c.rect(DPR * OX, DPR * OY, DPR * W * S, DPR * H * S); c.clip(); }
function comp(b, alpha, op) {
  X.save(); X.setTransform(1, 0, 0, 1, 0, 0); clipScreen(X);
  X.globalCompositeOperation = op || 'multiply'; X.globalAlpha = alpha;
  if (b > 0.05 && FILTER_OK) { X.filter = `blur(${(b * S * DPR).toFixed(2)}px)`; X.drawImage(fig, 0, 0); }
  else if (b > 0.05) {
    const k = 1 / (1 + b * 0.55); tmp.width = Math.max(1, PW * k | 0); tmp.height = Math.max(1, PH * k | 0);
    TM.imageSmoothingQuality = 'high'; TM.drawImage(fig, 0, 0, tmp.width, tmp.height);
    X.imageSmoothingQuality = 'high'; X.drawImage(tmp, 0, 0, PW, PH);
  } else X.drawImage(fig, 0, 0);
  X.restore();
}
function layer(b, draw, alpha = 1, op) {
  F.setTransform(1, 0, 0, 1, 0, 0); F.globalCompositeOperation = 'source-over'; F.globalAlpha = 1;
  F.clearRect(0, 0, PW, PH); stageT(F); draw(F); comp(b, alpha, op);
}

/* ── control rods: collected while drawing, shadowed softly afterwards ───── */
let RODS = [];
function rod(c, x, y, dx = 30) {
  const p = c.getTransform().transformPoint(new DOMPoint(x, y));
  RODS.push([(p.x / DPR - OX) / S, (p.y / DPR - OY) / S, dx]);
}
function drawRods(alpha = 1) {
  if (!RODS.length) return;
  const R = RODS; RODS = [];
  layer(2.4, c => {
    c.lineCap = 'round';
    for (const [x, y, dx] of R) {
      c.strokeStyle = 'rgba(34,20,10,0.5)'; c.lineWidth = 3.4;
      c.beginPath(); c.moveTo(x, y); c.lineTo(x + dx, H + 60); c.stroke();
      c.lineWidth = 1.5; c.beginPath(); c.arc(x, y, 3.5, 0, TAU); c.stroke();
    }
  }, 0.75 * alpha);
}

/* ── leather-cutting primitives ─────────────────────────────────────────── */
const PP = new Map();
const P = s => { let p = PP.get(s); if (!p) { p = new Path2D(s); PP.set(s, p); } return p; };
const limb = (L, w0, w1) => P(`M${-w0 / 2},0 Q${-w0 * 0.6},${L * 0.5} ${-w1 / 2},${L} Q0,${L + w1 * 0.75} ${w1 / 2},${L} Q${w0 * 0.6},${L * 0.5} ${w0 / 2},0 Q0,${-w0 * 0.75} ${-w0 / 2},0Z`);
const circ = (x, y, r) => { const p = new Path2D(); p.arc(x, y, r, 0, TAU); return p; };

// fill a leather piece, carve its pattern (holes let the lamp through), then ink the outline
function part(c, p, fill, carve, lw = 2, stroke = INK) {
  if (fill) { c.fillStyle = fill; c.fill(p); }
  if (carve) {
    c.save(); c.clip(p); c.globalCompositeOperation = 'destination-out';
    c.fillStyle = '#000'; c.strokeStyle = '#000'; c.lineCap = 'round'; c.lineJoin = 'round';
    carve(c); c.restore();
  }
  if (lw) { c.lineJoin = 'round'; c.lineCap = 'round'; c.lineWidth = lw; c.strokeStyle = stroke; c.stroke(p); }
}
const pat = {
  dots: (x0, y0, x1, y1, sp, r) => c => { let row = 0;
    for (let y = y0; y <= y1; y += sp * 0.87, row++) for (let x = x0 + (row & 1) * sp / 2; x <= x1; x += sp) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fill(); } },
  scales: (x0, y0, x1, y1, sp, lw = 1.2) => c => { c.lineWidth = lw; let row = 0;
    for (let y = y0; y <= y1; y += sp * 0.72, row++) for (let x = x0 + (row & 1) * sp / 2; x <= x1; x += sp) { c.beginPath(); c.arc(x, y, sp * 0.42, 0.12 * PI, 0.88 * PI); c.stroke(); } },
  lattice: (x0, y0, x1, y1, sp, lw = 1.2) => c => { c.lineWidth = lw; c.beginPath();
    for (let x = x0; x <= x1; x += sp) { c.moveTo(x, y0); c.lineTo(x, y1); }
    for (let y = y0; y <= y1; y += sp) { c.moveTo(x0, y); c.lineTo(x1, y); } c.stroke(); },
  all: (...fs) => c => fs.forEach(f => f && f(c))
};
function spiral(c, cx, cy, r, turns = 1.7, lw = 1.4, dir = 1) {
  c.lineWidth = lw; c.beginPath();
  for (let i = 0; i <= 40; i++) { const u = i / 40, a = dir * u * turns * TAU, rr = r * (1 - u * 0.85);
    const x = cx + Math.cos(a) * rr, y = cy + Math.sin(a) * rr; i ? c.lineTo(x, y) : c.moveTo(x, y); }
  c.stroke();
}
function rivet(c, x, y, r = 2.4) { c.beginPath(); c.arc(x, y, r, 0, TAU); c.fillStyle = INK; c.fill(); }

function ik(sx, sy, tx, ty, L1, L2, bend = 1) {
  const dx = tx - sx, dy = ty - sy;
  const d = clamp(Math.hypot(dx, dy), Math.abs(L1 - L2) + 0.01, L1 + L2 - 0.01);
  const base = Math.atan2(-dx, dy);
  const al = Math.acos(clamp((L1 * L1 + d * d - L2 * L2) / (2 * L1 * d), -1, 1));
  const be = Math.acos(clamp((L1 * L1 + L2 * L2 - d * d) / (2 * L1 * L2), -1, 1));
  return [base + bend * al, -bend * (PI - be)];
}
const bez = (a, b, c, d, u) => { const v = 1 - u; return v * v * v * a + 3 * v * v * u * b + 3 * v * u * u * c + u * u * u * d; };

// flowing strip (sleeves, sashes, ribbons): centre-line driven by travelling waves
function strip(c, x, y, a0, N, seg, w0, w1, t, amp, freq, fill, grav = 0, lw = 1.3, carve) {
  let px = x, py = y, a = a0; const pts = [[px, py, a]];
  for (let i = 1; i <= N; i++) {
    const k = i / N;
    a += amp * Math.sin(t * freq - i * 0.55) * (0.3 + k) / N * 3 + grav * (PI / 2 - a) / N;
    px += Math.cos(a) * seg; py += Math.sin(a) * seg; pts.push([px, py, a]);
  }
  const L = [], R = [];
  pts.forEach(([px, py, a], i) => { const w = lerp(w0, w1, i / N) / 2, nx = -Math.sin(a) * w, ny = Math.cos(a) * w;
    L.push([px + nx, py + ny]); R.push([px - nx, py - ny]); });
  const p = new Path2D(); p.moveTo(L[0][0], L[0][1]);
  for (let i = 1; i < L.length; i++) p.lineTo(L[i][0], L[i][1]);
  for (let i = R.length - 1; i >= 0; i--) p.lineTo(R[i][0], R[i][1]);
  p.closePath(); part(c, p, fill, carve, lw);
  return pts;
}

/* ── pheasant tail feather (雉翎) ────────────────────────────────────────── */
function feather(c, x0, y0, cx, cy, x1, y1, w) {
  const N = 30, L = [], R = [], M = [];
  for (let i = 0; i <= N; i++) {
    const u = i / N, v = 1 - u;
    const x = v * v * x0 + 2 * v * u * cx + u * u * x1, y = v * v * y0 + 2 * v * u * cy + u * u * y1;
    const dx = 2 * v * (cx - x0) + 2 * u * (x1 - cx), dy = 2 * v * (cy - y0) + 2 * u * (y1 - cy), l = Math.hypot(dx, dy) || 1;
    const ww = w * (1 - u * 0.8) + 0.4, nx = -dy / l * ww, ny = dx / l * ww;
    L.push([x + nx, y + ny]); R.push([x - nx, y - ny]); M.push([x, y, nx, ny]);
  }
  const p = new Path2D(); p.moveTo(L[0][0], L[0][1]);
  L.forEach(q => p.lineTo(q[0], q[1])); for (let i = N; i >= 0; i--) p.lineTo(R[i][0], R[i][1]); p.closePath();
  part(c, p, 'rgba(46,26,12,0.9)', c => { c.lineWidth = 1.1;
    for (let i = 2; i < N; i += 2) { const [x, y, nx, ny] = M[i]; c.beginPath(); c.moveTo(x - nx * 0.7, y - ny * 0.7); c.lineTo(x + nx * 0.7, y + ny * 0.7); c.stroke(); } }, 0.9);
}

/* ── ruyi cloud (如意云) ─────────────────────────────────────────────────── */
const CLOUD = 'M-60,10 C-82,10 -86,-14 -66,-20 C-64,-42 -36,-46 -26,-30 C-20,-54 16,-56 22,-32 C34,-46 62,-40 58,-18 C76,-16 80,6 62,10 C88,12 108,0 116,-14 C114,8 92,24 60,20 C40,18 20,14 0,16 C-22,18 -42,14 -60,10Z';
function cloud(c, x, y, s, fill, flip = 1) {
  c.save(); c.translate(x, y); c.scale(s * flip, s);
  part(c, P(CLOUD), fill, c => { spiral(c, -50, -8, 13, 1.4, 2.2, -1); spiral(c, -3, -22, 15, 1.5, 2.2, -1); spiral(c, 38, -14, 12, 1.4, 2.2, -1);
    c.lineWidth = 1.8; c.beginPath(); c.moveTo(-58, 5); c.bezierCurveTo(-20, 11, 30, 5, 60, 12); c.stroke(); }, 2.2);
  c.restore();
}
function puff(c, x, y, r, a) {  // dust puff
  c.save(); c.translate(x, y); c.globalAlpha = a;
  const p = new Path2D(); p.arc(0, 0, r, 0, TAU); p.arc(r * 0.8, -r * 0.3, r * 0.7, 0, TAU); p.arc(-r * 0.8, -r * 0.1, r * 0.6, 0, TAU);
  c.fillStyle = 'rgba(110,70,34,0.55)'; c.fill(p);
  c.globalCompositeOperation = 'destination-out'; spiral(c, 0, -r * 0.1, r * 0.55, 1.2, 1.4); c.restore();
}

/* ── landscape pieces ───────────────────────────────────────────────────── */
function ridgeY(o, x) {
  const X0 = (x + o.xoff) * o.freq; let v = 0, a = 1, f = 1, n = 0;
  for (let k = 0; k < o.oct; k++) { v += a * (o.round ? (sn(X0 * f + o.seed * 7.13 + k * 3.7) + 1) / 2 : 1 - Math.abs(sn(X0 * f + o.seed * 7.13 + k * 3.7))); n += a; a *= 0.5; f *= 2.03; }
  return o.base - o.amp * v / n;
}
function mountains(c, o) {
  const p = new Path2D(); p.moveTo(-30, H + 30);
  for (let x = -30; x <= W + 30; x += 6) p.lineTo(x, ridgeY(o, x));
  p.lineTo(W + 30, H + 30); p.closePath();
  part(c, p, o.fill, o.cut === false ? null : c => {
    c.lineWidth = 1.5; c.setLineDash([16, 7]);
    for (let k = 1; k <= 3; k++) { c.beginPath(); for (let x = -30; x <= W + 30; x += 10) { const y = ridgeY(o, x) + k * (o.band || 16); x < -29 ? c.moveTo(x, y) : c.lineTo(x, y); } c.stroke(); }
    c.setLineDash([]);
  }, o.lw ?? 2);
  if (o.pines) for (let i = -2; i < 40; i++) {
    const base = i * o.pines - (o.xoff % o.pines), x = base + h1(i + Math.floor(o.xoff / o.pines)) * 30;
    if (h1(i * 3.3 + Math.floor(o.xoff / o.pines) * 1.7) > 0.55) pine(c, x, ridgeY(o, x) + 4, o.pineS || 0.45, o.fill, o.t || 0);
  }
}
function pine(c, x, y, s, fill, t = 0) {
  c.save(); c.translate(x, y); c.scale(s, s);
  part(c, P('M-4,0 C-2,-30 -7,-60 -1,-96 L3,-96 C0,-60 5,-30 6,0Z'), fill, null, 1.5);
  for (let i = 0; i < 4; i++) {
    const yy = -28 - i * 20, w = 44 - i * 9, sw = 2 * Math.sin(t * 0.8 + i + x);
    const pad = new Path2D(`M${-w + sw},${yy} C${-w * 0.6},${yy - 13} ${w * 0.6},${yy - 13} ${w + sw},${yy} C${w * 0.4},${yy + 5} ${-w * 0.4},${yy + 5} ${-w + sw},${yy}Z`);
    part(c, pad, fill, c => { c.lineWidth = 1.2; for (let k = -w + 6; k < w - 4; k += 6) { c.beginPath(); c.moveTo(k, yy + 1); c.lineTo(k + 3, yy - 6); c.stroke(); } }, 1.5);
  }
  c.restore();
}
function greatWall(c, o, x0, x1, fill) {
  const top = new Path2D(); let first = true;
  const pts = [];
  for (let x = x0; x <= x1; x += 4) pts.push([x, ridgeY(o, x) + 5]);
  pts.forEach(([x, y], i) => { const m = (Math.floor(x / 6) & 1) ? 0 : -3.5; first ? top.moveTo(x, y - 9 + m) : top.lineTo(x, y - 9 + m); first = false; });
  for (let i = pts.length - 1; i >= 0; i--) top.lineTo(pts[i][0], pts[i][1] + 3);
  top.closePath(); part(c, top, fill, null, 1.2);
  for (let x = x0 + 60; x < x1 - 10; x += 170) {
    const y = ridgeY(o, x) + 5, tw = new Path2D(`M${x - 10},${y + 3} L${x - 10},${y - 22} L${x + 10},${y - 22} L${x + 10},${y + 3}Z M${x - 13},${y - 22} L${x},${y - 31} L${x + 13},${y - 22}Z`);
    part(c, tw, fill, c => { c.fillRect(x - 3, y - 17, 6, 7); }, 1.2);
  }
}
function tuft(c, x, y, s, t, fill = INK) {
  c.save(); c.translate(x, y); c.scale(s, s); c.strokeStyle = fill; c.lineCap = 'round';
  for (let i = 0; i < 6; i++) { const a = -0.9 + i * 0.36, l = 20 + 10 * h1(i + x * 0.01), sw = 3 * Math.sin(t * 1.5 + i + x * 0.03);
    c.lineWidth = 2.4 - i * 0.2; c.beginPath(); c.moveTo(0, 0); c.quadraticCurveTo(Math.sin(a) * l * 0.4, -l * 0.6, Math.sin(a) * l + sw, -l * Math.cos(a * 0.6)); c.stroke(); }
  c.restore();
}
function goose(c, x, y, s, f) {
  c.save(); c.translate(x, y); c.scale(s, s); c.fillStyle = INK; c.strokeStyle = INK; c.lineCap = 'round';
  c.beginPath(); c.ellipse(0, 0, 7, 2.2, 0, 0, TAU); c.fill();
  c.beginPath(); c.moveTo(6, -1); c.lineTo(11, -2.5); c.lineWidth = 1.4; c.stroke();
  c.lineWidth = 1.8; c.beginPath(); c.moveTo(-2, 0); c.quadraticCurveTo(-6, -8 * f, -12, -12 * f); c.moveTo(1, 0); c.quadraticCurveTo(-1, -9 * f, -5, -14 * f); c.stroke();
  c.restore();
}
function banner(c, x, y, h, t, w, fill, dir = 1) {
  c.save(); c.translate(x, y);
  c.lineWidth = 3; c.strokeStyle = INK; c.beginPath(); c.moveTo(0, 0); c.lineTo(0, -h); c.stroke();
  const p = new Path2D(); const L = 70 * dir;
  p.moveTo(0, -h + 4);
  for (let i = 1; i <= 8; i++) { const u = i / 8; p.lineTo(L * u, -h + 4 + 8 * Math.sin(t * 3 - u * 4) * u * w); }
  for (let i = 8; i >= 0; i--) { const u = i / 8; p.lineTo(L * u, -h + 44 - 6 * u + 8 * Math.sin(t * 3 - u * 4 + 0.4) * u * w); }
  p.closePath(); part(c, p, fill, pat.dots(-80, -h + 10, 80, -h + 40, 9, 1.6), 1.6);
  c.beginPath(); c.arc(0, -h - 4, 4, 0, TAU); c.fillStyle = INK; c.fill();
  c.restore();
}

/* ── the horse ──────────────────────────────────────────────────────────── */
const HG = 143;
const HS = {
  body: 'M92,-8 C100,-30 80,-48 55,-46 C20,-40 -30,-44 -60,-44 C-95,-44 -112,-22 -108,5 C-106,28 -92,40 -72,40 C-40,44 10,46 45,40 C70,36 88,22 92,-8Z',
  neck: 'M-22,-10 C-12,-50 10,-82 38,-98 L44,-112 L50,-99 C62,-98 72,-90 80,-78 C90,-62 98,-50 104,-40 C107,-33 102,-26 94,-27 C88,-27 84,-30 80,-30 C74,-40 60,-50 50,-52 C40,-50 34,-40 30,-28 C26,-8 30,10 24,22 L-8,22Z',
  hoof: 'M-6,-3 L7,-3 L10,10 L-8,10Z',
  cloth: 'M-50,-46 L24,-46 C28,-20 28,0 24,18 C12,24 0,16 -12,22 C-24,16 -36,24 -46,18 C-54,-2 -54,-26 -50,-46Z',
  saddle: 'M-34,-46 C-32,-58 -24,-62 -18,-52 L10,-52 C14,-62 22,-64 24,-50 L20,-42 L-30,-42Z'
};
function legA(g, ph) {
  if (g === 'gallop') {
    const f = p => [-(0.3 + 0.75 * Math.sin(p)), 1.7 * Math.pow(Math.max(0, Math.cos(p)), 1.3)];

/* ── text: vertical columns, inked in character by character ────────────── */
function inkText(lt, cols, o) {
  const fs = o.fs || 48, gap = fs * 1.14, colGap = o.colGap || fs * 1.6, dly = o.dly || 0.27;
  let tt = o.start ?? 1.6;
  stageT(X); X.save(); X.globalCompositeOperation = 'multiply';
  X.font = `${fs}px ${FONT}`; X.textAlign = 'center'; X.textBaseline = 'middle';
  let lastX = 0, lastY = 0, lastT = 0;
  cols.forEach((line, i) => {
    const x = (o.x ?? 1512) - i * colGap; let y = (o.y ?? 120) + fs / 2;
    [...line].forEach((ch, j) => {
      const st = tt + j * dly, a = ss((lt - st) / 1.1);
      if (a > 0) {
        X.globalAlpha = a * (o.alpha || 0.9);
        if (FILTER_OK && a < 1) X.filter = `blur(${((1 - a) * 5 * S * DPR).toFixed(2)}px)`;
        X.fillStyle = 'rgb(30,14,6)'; X.fillText(ch, x, y + (1 - a) * 5); X.filter = 'none';
      }
      lastX = x; lastY = y; y += gap;
    });
    lastT = tt + line.length * dly; tt = lastT + (o.pause ?? 0.6);
  });
  X.restore();
  return { x: lastX, y: lastY, t: lastT, fs };
}
function seal(lt, x, y, st, sz = 38, txt = '李颀') {

  X.globalAlpha = a * 0.9; X.globalCompositeOperation = 'multiply';
  X.fillStyle = 'rgb(178,34,22)'; X.beginPath(); X.roundRect(-sz / 2, -sz / 2, sz, sz, 3); X.fill();
  X.globalCompositeOperation = 'source-over'; X.fillStyle = 'rgba(245,224,190,0.92)';
  X.font = `${sz * 0.42}px ${FONT}`; X.textAlign = 'center'; X.textBaseline = 'middle';
  X.fillText(txt[0], sz * 0.2, -sz * 0.2); X.fillText(txt[1], sz * 0.2, sz * 0.2);
  X.fillText('之', -sz * 0.2, -sz * 0.2); X.fillText('印', -sz * 0.2, sz * 0.2);
  X.restore();
}

/* ── light on the screen ────────────────────────────────────────────────── */
function glowDisc(x, y, r, col, edge = 0.94, halo = 2.2, ha = 0.35) {
  stageT(X); X.save(); X.globalCompositeOperation = 'screen';
  let g = X.createRadialGradient(x, y, r * 0.5, x, y, r * halo);
  g.addColorStop(0, `rgba(${col},${ha})`); g.addColorStop(1, `rgba(${col},0)`);
  X.fillStyle = g; X.fillRect(x - r * halo, y - r * halo, r * halo * 2, r * halo * 2);
  g = X.createRadialGradient(x, y, 0, x, y, r);
  g.addColorStop(0, `rgba(${col},0.75)`); g.addColorStop(edge, `rgba(${col},0.6)`); g.addColorStop(1, `rgba(${col},0)`);
  X.fillStyle = g; X.beginPath(); X.arc(x, y, r, 0, TAU); X.fill();
  X.restore();
}

    draw(lt, t) {
      const flute = {};
      const bowAt = x => 0.55 * ss((lt - 7 - (x - 600) / 380) / 3);
      const row = (c, n, x0, step, gy, sc, opt) => {
        for (let i = 0; i < n; i++) {
          const x = x0 + i * step + (i & 1) * step * 0.18, bw = bowAt(x);
          c.save(); c.translate(x, gy - 93 * sc); c.scale(-sc, sc);
          general(c, { t: t + i * 1.7, spear: true, simple: opt.simple, feathers: opt.feat && opt.feat(i), seed: i + opt.seed, spearUp: 150,
            spearA: -bw * 0.28, headA: bw * 1.15, body: opt.body(i), skirtCol: opt.skirt, sleeve: opt.sleeve, stance: 0,
            nearArm: ik(6, -72, 28, -40 + bw * 6, 30, 28, 1) });
          c.restore();
        }
      };
      layer(3, c => {
        mountains(c, { seed: 31, base: 650, amp: 150, freq: 0.0019, oct: 3, xoff: 0, fill: 'rgba(40,34,30,0.35)' });
        c.fillStyle = 'rgba(40,30,26,0.28)'; c.beginPath(); c.ellipse(1130 + lt * 4, 200, 180, 8, 0, 0, TAU); c.fill();
        for (let i = 0; i < 5; i++) tent(c, 690 + i * 160, 676, 0.72, 'rgba(40,30,24,0.5)');
        row(c, 13, 630, 56, 700, 0.38, { simple: true, seed: 0, body: () => C.black, skirt: C.black, sleeve: C.black });
      });
      layer(1.4, c => {
        banner(c, 612, 792, 370, t, 0.5, C.red2, 1); banner(c, 1372, 792, 390, t + 1, 0.5, C.black, 1);
        flame(c, 1000, 792, 1.1, t);
        row(c, 10, 650, 76, 792, 0.52, { simple: true, seed: 20, body: i => i % 3 ? C.brown : C.teal, skirt: C.black });
      });
      layer(0.3, c => row(c, 6, 700, 122, 896, 0.7, { simple: false, seed: 40, feat: i => i === 2, body: i => i & 1 ? C.red : C.green, skirt: C.green }));
      layer(0, c => {
        part(c, P('M-20,920 L-20,770 C40,748 120,740 220,748 C300,752 360,764 420,790 C470,812 520,860 560,920Z'), 'rgba(40,28,20,0.86)', c => { c.lineWidth = 1.4; c.setLineDash([16, 8]); c.beginPath(); c.moveTo(0, 790); c.quadraticCurveTo(250, 760, 480, 850); c.stroke(); c.setLineDash([]); spiral(c, 140, 830, 18, 1.5, 1.6); spiral(c, 320, 820, 14, 1.5, 1.6, -1); }, 2);
        tuft(c, 80, 752, 1.1, t); tuft(c, 400, 784, 0.9, t + 2);
        const s = 1.2;
        const o = { x: 250, y: 752 - 152 * s, s, t, mode: 'flute', lean: 0.02 * Math.sin(t * 0.6), headA: 0.1 + 0.03 * Math.sin(t * 0.6), rodNeck: -20, rodHand: 30, wind: 0.45 };
        lady(c, o); flute.tip = o.tip;
      });
      // the flute's melody drifting out over the camp
      if (flute.tip) layer(0.8, c => {
        const [fx, fy] = flute.tip, grow = ss((lt - 1.2) / 7);
        c.lineCap = 'round';
        for (let k = 0; k < 3; k++) {
          let px = fx, py = fy;
          for (let i = 1; i <= 70; i++) {
            const u = i / 70; if (u > grow) break;
            const x = fx + u * (1080 - k * 120), y = fy - u * (40 + k * 70) + (6 + 46 * u) * Math.sin(u * 8.5 - t * 1.3 + k * 2.1);
            c.strokeStyle = `rgba(30,18,10,${(0.42 * (1 - u * 0.8)).toFixed(3)})`; c.lineWidth = 2.6 * (1 - u) + 0.5;
            c.beginPath(); c.moveTo(px, py); c.lineTo(x, y); c.stroke(); px = x; py = y;
          }
        }
        for (let j = 0; j < 9; j++) {
          const a = fr(lt * 0.09 + j / 9), k = j % 3; if (a > grow) continue;
          const x = fx + a * (1080 - k * 120), y = fy - a * (40 + k * 70) + (6 + 46 * a) * Math.sin(a * 8.5 - t * 1.3 + k * 2.1) - 16;
          c.globalAlpha = Math.sin(a * PI) * 0.7; c.strokeStyle = INK; spiral(c, x, y, 5 + a * 7, 1.5, 1.2 + (1 - a)); c.globalAlpha = 1;
        }
      });
      // tears falling like rain
      const rain = ss((lt - 9.8) / 4);
      if (rain > 0) layer(0.9, c => {
        c.strokeStyle = 'rgba(40,30,26,0.4)'; c.lineCap = 'round';
        for (let i = 0; i < 240 * rain; i++) {
          const sp = 0.8 + h1(i) * 0.6, y = fr(h1(i * 3.1) + lt * sp * 0.9) * 1000 - 50, x = fr(h1(i * 7.7)) * 1700 - 50 - y * 0.12;
          c.lineWidth = 1 + h1(i * 2) * 0.9; c.beginPath(); c.moveTo(x, y); c.lineTo(x - 5, y + 28 + h1(i) * 20); c.stroke();
        }
      }, rain);
      drawRods();
    },
    text(lt) {
      const e = inkText(lt, ['今为羌笛出塞声', '使我三军泪如雨'], { fs: 44 });
      seal(lt, e.x, e.y + 64, e.t + 1.4, 36);
    }
  }
];

/* ── lacquered stage frame ──────────────────────────────────────────────── */
function frame() {
  stageT(X); X.save(); X.globalCompositeOperation = 'source-over';
  const p = new Path2D(); p.rect(-FR, -FR, W + FR * 2, H + FR * 2); p.rect(0, 0, W, H);
  const g = X.createLinearGradient(0, -FR, 0, H + FR); g.addColorStop(0, '#2a100a'); g.addColorStop(0.5, '#1a0906'); g.addColorStop(1, '#2a100a');
  X.fillStyle = g; X.fill(p, 'evenodd');
  X.strokeStyle = 'rgba(196,146,70,0.55)'; X.lineWidth = 1.4; X.strokeRect(-7, -7, W + 14, H + 14);
  X.strokeStyle = 'rgba(196,146,70,0.25)'; X.lineWidth = 1; X.strokeRect(-FR + 7, -FR + 7, W + FR * 2 - 14, H + FR * 2 - 14);
  // fret (回纹) along top and bottom rails
  X.strokeStyle = 'rgba(196,146,70,0.32)'; X.lineWidth = 1.2;
  for (const yy of [-FR / 2 - 6, H + FR / 2 - 6]) for (let x = 20; x < W - 20; x += 28) {
    X.beginPath(); X.moveTo(x, yy + 12); X.lineTo(x, yy); X.lineTo(x + 18, yy); X.lineTo(x + 18, yy + 9); X.lineTo(x + 6, yy + 9); X.lineTo(x + 6, yy + 4); X.lineTo(x + 12, yy + 4); X.stroke();
  }
  X.restore();
}

/* ── main loop ──────────────────────────────────────────────────────────── */
const TOTAL = SCENES.reduce((a, s) => a + s.dur, 0);
let clock = 0, last = performance.now(), paused = false;
function applyHash() { const q = new URLSearchParams(location.hash.slice(1)); if (q.has('s')) { let a = 0; for (let i = 0; i < +q.get('s'); i++) a += SCENES[i].dur; clock = a + +(q.get('t') || 0); } paused = q.has('p'); ZOOM = q.has('z') ? q.get('z').split(',').map(Number) : null; resize(); }
applyHash(); addEventListener('hashchange', applyHash);
let lastW = 0, lastH = 0;
function sceneAt(tm) { let a = 0; for (let i = 0; i < SCENES.length; i++) { if (tm < a + SCENES[i].dur) return [i, tm - a, a]; a += SCENES[i].dur; } return [0, 0, 0]; }
addEventListener('keydown', e => {
  const [i, , a] = sceneAt(clock);
  if (e.code === 'Space') { paused = !paused; e.preventDefault(); }
  else if (e.code === 'ArrowRight') clock = (a + SCENES[i].dur + 0.01) % TOTAL;
  else if (e.code === 'ArrowLeft') clock = i ? a - SCENES[i - 1].dur : TOTAL - SCENES[SCENES.length - 1].dur;
});

function frameDraw(now) {
  const dt = Math.min(0.1, (now - last) / 1000); last = now;
  if (innerWidth !== lastW || innerHeight !== lastH) { lastW = innerWidth; lastH = innerHeight; resize(); }
  if (!paused) clock = (clock + dt) % TOTAL;
  const t = clock, [si, lt] = sceneAt(t), sc = SCENES[si];
  X.setTransform(1, 0, 0, 1, 0, 0); X.globalCompositeOperation = 'source-over'; X.globalAlpha = 1; X.filter = 'none';
  X.fillStyle = '#0a0503'; X.fillRect(0, 0, PW, PH);
  // warm spill around the stage
  stageT(X); { const g = X.createRadialGradient(W / 2, H / 2, 300, W / 2, H / 2, 1100); g.addColorStop(0, 'rgba(90,40,16,0.35)'); g.addColorStop(1, 'rgba(90,40,16,0)'); X.fillStyle = g; X.fillRect(-400, -300, W + 800, H + 600); }
  // lamp-lit paper
  const lx = W * 0.46 + 24 * sn(t * 0.21), ly = H * 0.4 + 14 * sn(t * 0.27 + 4);
  const g = X.createRadialGradient(lx, ly, 30, lx, ly, 1080);
  g.addColorStop(0, sc.tint[0]); g.addColorStop(0.5, sc.tint[1]); g.addColorStop(1, sc.tint[2]);
  X.fillStyle = g; X.fillRect(0, 0, W, H);
  if (sc.glow) sc.glow(lt, t);
  sc.draw(lt, t);
  if (sc.post) sc.post(lt, t);
  // paper grain
  stageT(X); X.save(); X.globalCompositeOperation = 'multiply'; X.globalAlpha = 0.75; X.drawImage(paper, 0, 0, W, H); X.restore();
  if (sc.text) sc.text(lt, t);
  // vignette & lamp flicker / dimming between scenes
  stageT(X); X.save();
  const v = X.createRadialGradient(W / 2, H * 0.45, 260, W / 2, H * 0.45, 980);
  v.addColorStop(0, 'rgba(40,14,4,0)'); v.addColorStop(1, 'rgba(40,14,4,0.5)'); X.fillStyle = v; X.fillRect(0, 0, W, H);
  const fin = sc.fadeIn || 1.2, fout = sc.fadeOut || 1.2;
  let b = Math.min(ss(lt / fin), ss((sc.dur - lt) / fout));
  if (si === 0 && lt < fin) b *= 0.85 + 0.15 * sn(t * 14);
  b = lerp(0.04, 1, b) * (1 - 0.035 * vn(t * 3.1) - 0.02 * vn(t * 11.3));
  X.globalCompositeOperation = 'multiply';
  X.fillStyle = `rgb(${255 * b | 0},${255 * Math.pow(b, 1.12) | 0},${255 * Math.pow(b, 1.35) | 0})`; X.fillRect(0, 0, W, H);
  X.restore();
  frame();
  requestAnimationFrame(frameDraw);
}
resize();
requestAnimationFrame(frameDraw);
</script>
