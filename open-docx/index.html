<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>DOCX → PDF</title>
    <style>
      :root {
        --bg: #f6f7f9;
        --card: #ffffff;
        --border: #e3e6ea;
        --text: #1b1f24;
        --muted: #6b7280;
        --accent: #2d6cdf;
        --accent-weak: #eaf1fe;
        --ok: #12805c;
        --err: #c0392b;
        --shadow: 0 1px 3px rgba(0, 0, 0, 0.06), 0 8px 24px rgba(0, 0, 0, 0.05);
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f1216;
          --card: #171b21;
          --border: #262c34;
          --text: #e8eaed;
          --muted: #9aa3af;
          --accent: #5b8cf0;
          --accent-weak: #1b2740;
          --ok: #37c391;
          --err: #f0685a;
          --shadow: 0 1px 3px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.35);
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
        -webkit-font-smoothing: antialiased;
      }
      .wrap { max-width: 720px; margin: 0 auto; padding: 48px 20px 80px; }
      header { margin-bottom: 24px; }
      h1 { font-size: 1.6rem; margin: 0 0 6px; letter-spacing: -0.01em; }
      .sub { color: var(--muted); margin: 0; font-size: 0.95rem; }
      .card {
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 14px;
        box-shadow: var(--shadow);
        padding: 8px;
      }
      #drop-zone {
        border: 1.5px dashed var(--border);
        border-radius: 10px;
        padding: 40px 24px;
        text-align: center;
        cursor: pointer;
        transition: border-color 0.15s, background 0.15s;
      }
      #drop-zone:hover, #drop-zone.drag {
        border-color: var(--accent);
        background: var(--accent-weak);
      }
      #drop-zone .big { font-size: 1.05rem; font-weight: 600; }
      #drop-zone .small { color: var(--muted); font-size: 0.9rem; margin-top: 4px; }
      #file-input { display: none; }
      .toolbar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        margin: 20px 2px 8px;
        min-height: 28px;
      }
      .toolbar h2 { font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.05em; color: var(--muted); margin: 0; }
      button.ghost {
        background: none;
        border: 1px solid var(--border);
        color: var(--muted);
        padding: 5px 12px;
        border-radius: 8px;
        font-size: 0.85rem;
        cursor: pointer;
      }
      button.ghost:hover:not(:disabled) { color: var(--text); border-color: var(--muted); }
      button.ghost:disabled { opacity: 0.45; cursor: default; }
      #empty-state { color: var(--muted); font-size: 0.92rem; padding: 8px 2px; }
      ul#file-list { list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column; gap: 8px; }
      .file-row {
        display: grid;
        grid-template-columns: 1fr auto auto;
        align-items: center;
        gap: 12px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 10px;
        padding: 12px 14px;
      }
      .file-meta { min-width: 0; }
      .file-name { display: block; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
      .file-size { color: var(--muted); font-size: 0.82rem; }
      .file-status { font-size: 0.85rem; color: var(--muted); white-space: nowrap; }
      .file-status[data-state="done"] { color: var(--ok); }
      .file-status[data-state="error"] { color: var(--err); }
      .file-status[data-state="working"]::before {
        content: "";
        display: inline-block;
        width: 10px; height: 10px;
        margin-right: 6px;
        border: 2px solid currentColor;
        border-right-color: transparent;
        border-radius: 50%;
        vertical-align: -1px;
        animation: spin 0.7s linear infinite;
      }
      @keyframes spin { to { transform: rotate(360deg); } }
      .download-link {
        display: inline-block;
        background: var(--accent);
        color: #fff;
        text-decoration: none;
        padding: 6px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        white-space: nowrap;
      }
      .download-link:hover { filter: brightness(1.07); }
      footer { margin-top: 28px; color: var(--muted); font-size: 0.82rem; text-align: center; }
      footer code { background: var(--accent-weak); padding: 1px 5px; border-radius: 4px; }
    </style>
  </head>
  <body>
    <div class="wrap">
      <header>
        <h1>DOCX → PDF</h1>
        <p class="sub">Convert Word documents to PDF entirely in your browser — nothing is uploaded to a server.</p>
      </header>

      <div class="card">
        <div id="drop-zone">
          <div class="big">Drop .docx files here</div>
          <div class="small">or click to choose one or more files</div>
          <input id="file-input" type="file" accept=".docx" multiple />
        </div>
      </div>

      <div class="toolbar">
        <h2>Files</h2>
        <button id="clear-btn" class="ghost" disabled>Clear</button>
      </div>
      <p id="empty-state">No files yet. Add some above to get started.</p>
      <ul id="file-list"></ul>

      <footer>
        Powered by <code>open-docx</code> — a zero-dependency converter compiled to run client-side.
      </footer>
    </div>

    <script>
      // The drop zone opens the file picker; the input itself is hidden.
      document.getElementById('drop-zone').addEventListener('click', function () {
        document.getElementById('file-input').click();
      });
    </script>
    <script src="./dist/app.js"></script>
  </body>
</html>
