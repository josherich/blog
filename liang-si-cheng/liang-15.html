33.58" transform="scale(0.91809 1)">WIDTH OF BEAM = DIAMETER OF COLUMN</text><text class="en" x="0.000" y="50.37" font-size="33.58" transform="scale(0.91809 1)">+ 2 INCHES; DEPTH = ⁶⁄₅ WIDTH. THUS</text><text class="en" x="0.000" y="100.74" font-size="33.58" transform="scale(0.91809 1)">RATIO BETWEEN DEPTH &amp; WIDTH OF</text><text class="en" x="0.000" y="151.11" font-size="33.58" transform="scale(0.91809 1)">BEAM IS AROUND 6:5 OR 5:4.</text></g><g class="label" id="caption24" transform="translate(476.045 2026.648) rotate(0)"><title>柱　凡檐柱，以6斗口定徑，以60斗口定高。 其他部位之柱，處檐柱加舉定高，徑視檐柱徑增二寸為定法，不側腳無卷殺。 惟收分⁷/₁₀₀₀。</title><text class="zh" x="0.000" y="0.0" font-size="39.506" transform="scale(0.89408 1)">柱　凡簷柱，以</text><text class="en" x="280.000" y="0.0" font-size="39.506" transform="scale(0.89408 1)">6</text><text class="zh" x="305.000" y="0.0" font-size="39.506" transform="scale(0.89408 1)">斗口定徑，以</text><text class="en" x="545.000" y="0.0" font-size="39.506" transform="scale(0.89408 1)">60</text><text class="zh" x="595.350" y="0.0" font-size="39.506" transform="scale(0.89408 1)">斗口定高。</text><text class="zh" x="0.000" y="48.888" font-size="39.506" transform="scale(0.89408 1)">其他部位之柱，處檐柱加舉定高，徑視</text><text class="zh" x="0.000" y="97.777" font-size="39.506" transform="scale(0.89408 1)">檐柱徑增二寸為定法，不側腳無卷殺。</text><text class="zh" x="0.000" y="146.665" font-size="39.506" transform="scale(0.89408 1)">惟收分⁷/₁₀₀₀。</text></g><g class="label" id="caption25" transform="translate(499.749 2208.375) rotate(0)"><title>Peripheral column is 6 Tou-k’ou in diameter, 60 Tou- k’ou in height. Diameter for hypos- tyle column = 6 Tou-k’ou + 2 inches.</title><text class="en" x="0.000" y="0.0" font-size="35.555" transform="scale(0.99997 1)">PERIPHERAL COLUMN</text><text class="en" x="0.000" y="45.926" font-size="35.555" transform="scale(0.99997 1)">IS 6 TOU-K’OU IN DIAMETER, 60 TOU-</text><text class="en" x="0.000" y="91.851" font-size="35.555" transform="scale(0.99997 1)">K’OU IN HEIGHT. DIAMETER FOR HYPOS-< ection of the rafter is increased from the eave up toward the ridge. The lowest section is a 50% slope; the next, 70%; the next, 80%; to the 90% raise of the top section is added a “Ping-shui” of 4 Tou-k’ou, making an approximately A 100% or 45° slope.</title><text class="en" x="6.314" y="-1.975" font-size="37.531" transform="scale(0.93850 1)">THE PITCH OF EACH SECTION OF THE RAFTER IS</text><text class="en" x="51.861" y="45.432" font-size="37.531" transform="scale(0.95220 1)">INCREASED FROM THE EAVE UP TOWARD THE</text><text class="en" x="120.493" y="92.839" font-size="37.531" transform="scale(1.00000 1)">RIDGE. THE LOWEST SECTION IS A 50%</text><text class="en" x="207.406" y="140.246" font-size="37.531" transform="scale(1.00000 1)">SLOPE; THE NEXT, 70%; THE NEXT,</text><text class="en" x="284.442" y="185.678" font-size="37.531" transform="scale(1.00000 1)">80%; TO THE 90% RAISE OF</text><text class="en" x="298.269" y="233.084" font-size="37.531" transform="scale(1.00000 1)">THE TOP SECTION IS ADDED A</text><text class="en" x="397.512" y="280.491" font-size="37.531" transform="scale(0.97395 1)">“PING-SHUI” OF 4 TOU-K’OU,</text><text class="en" x="466.366" y="327.898" font-size="37.531" transform="scale(0.87251 1)">MAKING AN APPROXIMATELY</text><text class="en" x="574.810" y="375.305" font-size="37.531" transform="scale(1.00000 1)">A 100% OR 45°</text><text class="en" x="683.451" y="424.688" font-size="37.531" transform="scale(1.00000 1)">SLOPE.</text></g><g class="label" id="caption49" transform="translate(1388.629 1274.062) rotate(0)"><title>步架 X</title><text class="zh" x="0.000" y="0.0" font-size="33.58" transform="scale(1.00000 1)">步架 </text><text class="en" x="77.000" y="0.0" font-size="33.58" transform="scale(1.00000 1)">X</text></g><g class="label" id="caption50" transform="translate(1613.812 1274.062) rotate(0)"><title>步架 X</title><text class="zh" x="0.000" y="0.0" font-size="33.58" transform="scale(1.00000 1)">步架 </text><text class="en" x="77.000" y="0.0" f
