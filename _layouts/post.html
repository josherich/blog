---
layout: default
---

<div class="post-page">

  <h2>{{ page.title }}</h2>
  <p class="meta">{{ page.date | date_to_string }}</p>

  <div class="post">
    {{ content }}
  </div>

  <button class="toggle-btn">=</button>
  <div class="drawer" id="tocDrawer"></div>

  <style>
    .drawer {
        position: fixed;
        top: 0;
        right: -400px; /* Initially off-screen */
        width: 400px;
        height: 700px;
        background-color: #f5f5f5;
        box-shadow: -2px 0 5px rgba(0, 0, 0, 0.2);
        overflow-y: auto;
        padding: 20px;
        transition: right 0.3s ease;
    }

    .drawer.open {
        right: 0; /* Slide in when opened */
    }

    .toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        color: #333;
        background-color: white;
        border: none;
        padding: 10px 15px;
        cursor: pointer;
        border-radius: 5px;
        transition: background-color 0.3s ease;
        line-height: 1em;
    }

    .toggle-btn:hover {
        background-color: #b4b4b46a;
    }

    ul {
        list-style-type: none;
        padding-left: 20px;
        cursor: pointer;
    }

    li {
        margin-bottom: 10px;
        cursor: pointer;
    }

    .section-title {
        color: #333;
        white-space: nowrap;
    }

    .first-sentence {
        font-size: 0.9em;
        color: #666;
    }
    li .level-1 {
        font-weight: bold;
    }
    li .level-2 {
        margin-left: 1em;
    }
    li .level-3 {
        margin-left: 2em;
    }
    li .level-4 {
        margin-left: 3em;
    }
  </style>
  <script>
    const index = window.tocIndex;

    function generateList(sections) {
        const ul = document.createElement("ul");
        sections.forEach(section => {
            const li = document.createElement("li");
            const titleSpan = document.createElement("span");
            titleSpan.classList.add("section-title");
            titleSpan.textContent = section["section_title"];
            titleSpan.setAttribute('title', section['section_title'])
            li.appendChild(titleSpan);

            if (section["first_sentence"]) {
                titleSpan.setAttribute('data-anchor', section['first_sentence']);
                titleSpan.classList.add('level-' + section['section_level'])

                // Scroll to content section on title click
                titleSpan.addEventListener("click", () => {
                    document.querySelectorAll('.post p').forEach(p => {
                      if (p.textContent.toLowerCase().includes(section['first_sentence']?.toLowerCase())) {
                        p.scrollIntoView({ behavior: 'smooth' });
                      }
                    })
                });
            }

            ul.appendChild(li);
        });
        return ul;
    }

    // Render the table of contents inside the drawer
    const drawer = document.getElementById("tocDrawer");
    if (index) {
      drawer.appendChild(generateList(index.index));
    }

    // Toggle button functionality
    const toggleButton = document.querySelector(".toggle-btn");
    toggleButton.addEventListener("click", () => {
        drawer.classList.toggle("open");
    });
    if (!index) {
        toggleButton.remove();
    }

    // Close drawer when clicking outside
    document.addEventListener("click", (event) => {
        if (!drawer.contains(event.target) && !toggleButton.contains(event.target)) {
            drawer.classList.remove("open");
        }
    });
  </script>
  <script src="//code.jquery.com/jquery-1.11.1.min.js"></script>

  <script async src="https://www.googletagmanager.com/gtag/js?id=UA-29751795-8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'UA-29751795-8');
  </script>


  <script>
    $("script[type='math/tex']").replaceWith(
      function(){
        var tex = $(this).text();
        return "<span class=\"inline-equation\">" +
               katex.renderToString(tex) +
               "</span>";
    });

    $("script[type='math/tex; mode=display']").replaceWith(
      function(){
        var tex = $(this).text();
        return "<div class=\"equation\">" +
               katex.renderToString("\\displaystyle "+tex) +
               "</div>";
    });
  </script>
</div>
